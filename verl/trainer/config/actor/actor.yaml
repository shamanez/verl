# Format checks enforced on CI:
# 1. Comments must appear above each field.
# 2. There must be a blank line between each field.
# 3. Inline comments (after a field on the same line) are not allowed.
# 4. Indentation level is respected for nested fields.

# Target class for this configuration
_target_: verl.workers.config.ActorConfig

# Number of rollouts per update (mirrors actor rollout_n)
rollout_n: ${oc.select:actor_rollout_ref.rollout.n,1}

# the abstract actor configs
# fsdp, fsdp2 or megatron. must be set.
strategy: ???

# Split each sample into sub-batches of this size for PPO
ppo_mini_batch_size: 256

# [Deprecated] Global micro batch size
ppo_micro_batch_size: null

# Local per-GPU micro batch size
ppo_micro_batch_size_per_gpu: null

# Whether to automatically adjust batch size at runtime
# oc.select: the default val for ref.log_prob_use_dynamic_bsz
use_dynamic_bsz: false

# Max tokens per GPU in one PPO batch; affects gradient accumulation
# Typically it should be: n * ${data.max_prompt_length} + ${data.max_response_length}
# oc.select: the default val for ref.log_prob_max_token_len_per_gpu
ppo_max_token_len_per_gpu: 16384

# PPO clip ratio
clip_ratio: 0.2

# Lower bound for asymmetric clipping (used in dual-clip PPO)
clip_ratio_low: 0.2

# Upper bound for asymmetric clipping (used in dual-clip PPO)
clip_ratio_high: 0.2

# Positive and negative tau for smoothing function in SAPO (https://arxiv.org/pdf/2511.20347)
# default values used in the paper with Qwen3-30B-A3B-Base
tau_pos: 1.0

# negative tau for smoothing function in SAPO
tau_neg: 1.05

# Whether to freeze vision model, if set true, it will be freeze vision model
freeze_vision_tower: false

# policy loss config
policy_loss:

  # # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
  _target_: verl.workers.config.PolicyLossConfig

  # Loss function mode: vanilla / clip-cov / kl-cov /gpg from https://arxiv.org/abs/2505.22617
  loss_mode: "vanilla"

  # Ratio of tokens to be clipped for clip-cov loss
  clip_cov_ratio: 0.0002

  # Lower bound for clip-cov loss
  clip_cov_lb: 1.0

  # Upper bound for clip-cov loss
  clip_cov_ub: 5.0

  # Ratio of tokens to be applied kl penalty for kl-cov loss
  kl_cov_ratio: 0.0002

  # KL divergence penalty coefficient
  ppo_kl_coef: 0.1

# Constant C in Dual-clip PPO; clips when advantage < 0 and ratio > C
clip_ratio_c: 3.0

# Loss aggregation mode: "token-mean", "seq-mean-token-sum", "seq-mean-token-mean", or "seq-mean-token-sum-norm"
loss_agg_mode: token-mean

# Scale factor for "seq-mean-token-sum-norm" loss aggregation mode.
# If null, uses response_length. Set to a constant to ensure consistent normalization.
loss_scale_factor: null

# Entropy regularization coefficient in PPO loss
entropy_coeff: 0

# When true, the actor forward will request entropy from the model
calculate_entropy: false

# This computes Σπ² needed for the Logit-Gradient Norm proxy W(τ) = Σ_t[1 - 2π_t + Σπ²]
# c.f. https://yingru.notion.site/The-Optimal-Token-Baseline-399211a558b782cfa936014c0d42dfb8
calculate_sum_pi_squared: false

# Whether to use KL loss instead of KL reward penalty. True for GRPO
use_kl_loss: false

# Whether to enable PrefixGrouper shared-prefix forward
use_prefix_grouper: false

# Whether to use torch.compile()
# oc.select: the default val for ref.use_torch_compile
use_torch_compile: true

# KL loss coefficient when use_kl_loss is enabled. For GRPO
kl_loss_coef: 0.001

# Type of KL divergence loss. Options: "kl"(k1), "abs", "mse"(k2), "low_var_kl"(k3), "full"
kl_loss_type: low_var_kl

# Number of PPO epochs per batch
ppo_epochs: 1

# Shuffle training data across PPO epochs
shuffle: false

# The seed used to construct mini-batch
data_loader_seed: 42

# checkpoint configs
checkpoint:

  # Target dataclass for this configuration
  _target_: verl.trainer.config.CheckpointConfig

  # What to include in saved checkpoints
  # with 'hf_model' you can save whole model as hf format, now only use sharded model checkpoint to save space
  save_contents: ['model', 'optimizer', 'extra']

  # For more flexibility, you can specify the contents to load from the checkpoint.
  # .xxx refers to the local variable xxx from the same level of hierarchy similar to python pkg
  load_contents: ${.save_contents}

  # Whether to save checkpoints asynchronously. Only effective for Megatron as of now.
  async_save: False
  
  # Mbridge config extension.
  # when vanilla_mbridge=True, and your filesystem is a distributed filesystem,(which means you write a file in node A
  # and you can read the file in node B immediately)
  # set `mbridge_config.distributed_filesystem=True` and `mbridge_config.memory_efficient=True` to 
  # speed up the checkpoint saving by 10x speed.
  mbridge_config: {}

  # Whether to perform strict validation during weight export
  strict: True

# optimizer configs
optim:

  # Learning rate
  lr: 1e-6

  # Warmup steps ratio (used if lr_warmup_steps is 0 or negative)
  lr_warmup_steps_ratio: 0.0

  # Total training steps (must be overridden at runtime)
  total_training_steps: -1

  # Weight decay
  weight_decay: 0.01

  # Prioritized. None, 0 or Negative values mean delegating to lr_warmup_steps_ratio.
  lr_warmup_steps: -1


# Whether to use custom fused kernels (e.g., FlashAttention, fused MLP)
use_fused_kernels: ${oc.select:actor_rollout_ref.model.use_fused_kernels,false}

# profile the actor model in `update_policy` 
profiler:

  # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
  _target_: verl.utils.profiler.ProfilerConfig

  # profiler tool, default same as profiler.tool in global config
  # choices: nsys, npu, torch
  tool: ${oc.select:global_profiler.tool,null}

  # whether enable profile on Actor
  enable: False
  
  # Whether to profile all ranks.
  all_ranks: False

  # The ranks that will be profiled. [] or [0,1,...]
  ranks: []

  # profile results saving path
  save_path: ${oc.select:global_profiler.save_path,null}

  # specific tool config which only related to the role
  tool_config:

    # nsys tool config
    nsys:

      # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
      _target_: verl.utils.profiler.config.NsightToolConfig
    
      # True for each task has its own database, False for all tasks in one training step share one database.
      discrete: ${oc.select:global_profiler.global_tool_config.nsys.discrete}
    
    # npu config
    npu:

      # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
      _target_: verl.utils.profiler.config.NPUToolConfig

      # Contents to profile, can be empty
      # options: npu, cpu, memory, shapes, module, stack
      contents: []

      # Collection level, optional values: level_none, level0, level1, level2.
      level: "level0"

      # Whether to automatically parse the data.
      analysis: True

      # True for each task has its own database, False for all tasks in one training step share one database.
      discrete: False
    
    # torch profiler config
    torch:

      # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
      _target_: verl.utils.profiler.config.TorchProfilerToolConfig

      # Contents to profile, can be empty
      # options: cuda, cpu, memory, shapes, stack
      contents: []

      # True for each task has its own database, False for all tasks in one training step share one database.
      discrete: false

    # torch memory profiler config
    torch_memory:

      # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
      _target_: verl.utils.profiler.config.TorchMemoryToolConfig

      # Maximum number of memory allocation entries to track
      trace_alloc_max_entries: ${oc.select:global_profiler.global_tool_config.torch_memory.trace_alloc_max_entries,100000}

      # Stack trace depth for memory allocations
      stack_depth: ${oc.select:global_profiler.global_tool_config.torch_memory.stack_depth,32}

    # msprobe precision debugger config
    precision_debugger:

      # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
      _target_: verl.utils.profiler.config.PrecisionDebuggerToolConfig

      # Path to msprobe config json
      config_path: ${oc.select:global_profiler.global_tool_config.precision_debugger.config_path,null}

      # Deprecated and ignored. Use global_profiler.steps.
      steps: null

      # Profile stages
      # Supported stages: actor_update, actor_compute_log_prob, ref_compute_log_prob,
      # compute_values, critic_update, compute_rm_score
      stages: ${oc.select:global_profiler.global_tool_config.precision_debugger.stages,null}

      # Whether to fail on unknown stage or missing msprobe
      strict: ${oc.select:global_profiler.global_tool_config.precision_debugger.strict,False}

# Router replay configuration for MoE models
router_replay:

  # Target dataclass for this configuration
  _target_: verl.workers.config.RouterReplayConfig

  # Router replay mode: disabled, R2, R3
  # - R2: Use R2 routing strategy (record mode)
  # - R3: Use R3 routing strategy (record mode)
  mode: disabled

  # File path to save recorded routing decisions
  # Required when mode is 'record', 'R2', or 'R3'
  record_file: null

  # File path to load recorded routing decisions for replay
  # Required when mode is 'replay'
  replay_file: null

# Communication-efficient compression config (two-circuit method).
# Disabled by default: when enabled=false the actor train path is a strict
# no-op (no forward hooks, no SVD/EMA buffers, no extra all-reduce, no RNG draw).
# The compressed path is selected ONLY by explicit comm_eff.* arguments.
comm_eff:

  # Target dataclass for this configuration
  _target_: verl.workers.config.CommEffConfig

  # Master switch. false => every comm_eff hook is a no-op
  enabled: false

  # Codec selector: "dense" = no activation compression, "prf_mask" = PRF
  # Bernoulli mask, "powersgd" = rank-r projection M_hat=(M@Q)@Q^T.
  # Declared here so Hydra struct-mode accepts compression_type overrides.
  compression_type: dense

  # Periodic dense optimizer-step cadence. 0 = off. >0 runs every Nth trainer
  # step without activation compression as a diagnostic control.
  clean_cadence: 0

  # Pipeline activation-masking sub-config (inert while parent enabled=false).
  # Algorithm A: in-graph h_tilde = h * mask (NO 1/(1-p) rescale) on the
  # pipeline-boundary decoder blocks, ONLY inside the actor train forward/backward.
  mask:

    # Target dataclass for this configuration
    _target_: verl.workers.config.CommEffMaskConfig

    # Whether activation masking runs (still gated by the parent comm_eff.enabled)
    enabled: true

    # Masked fraction in [0,1] = P(an element is zeroed). The measured
    # comm_eff/mask_ratio tracks this value. 0.0 means no masking.
    p: 0.95

    # Base seed folded into the mask PRF key (only drawn from when enabled=true)
    seed: 0

    # Logical pipeline-shard count: decoder blocks are partitioned into pp_size
    # contiguous shards and the last block of every shard EXCEPT the final shard
    # is masked (L from model.config, never hardcoded). L=16/pp_size=8 ->
    # [1,3,5,7,9,11,13]. Logical knob, not a real pipeline split.
    pp_size: 8

    # Extend the mask to the old-policy log-prob recompute in addition to the
    # actor-train forward. The anchor pass stays unmasked regardless of this flag.
    mask_recompute: false

    # Magnitude preservation. false (default) writes the raw product h * mask;
    # true applies inverted-dropout h * mask / (1-p) so E[h_tilde] = h (requires
    # p < 1). Mirrors CommEffMaskConfig.rescale.
    rescale: false

    # Magnitude-restoration scheme applied to h*mask (overrides `rescale` unless
    # "auto"). Switchable, non-destructive:
    #   none      -> h*mask                                  (raw; == rescale:false)
    #   constant  -> h*mask/(1-p)                            (inverted dropout; == rescale:true)
    #   rms_match -> h*mask * detach(rms_true/rms_masked)    (per-token EXACT RMS match: the
    #                downstream pre-norm RMSNorm then divides by the TRUE pre-mask RMS ->
    #                benign 1/RMS backward. Needs a 1-float/token RMS side channel ~0.6% comms.)
    #   auto      -> derive from `rescale` (true->constant, false->none).
    rescale_mode: auto

  # Asynchronous unmasked-anchor-circuit sub-config (inert while enabled=false).
  # Field names match CommEffAnchorConfig.
  anchor:

    # Target dataclass for this configuration
    _target_: verl.workers.config.CommEffAnchorConfig

    # Whether the anchor circuit runs (gated by the parent comm_eff.enabled)
    enabled: false

    # Anchor-refresh cadence in trainer steps (paper "K"). The anchor fires
    # when (step % cadence) == 0. Smoke=1 (fire every step); paper=20.
    cadence: 1

    # Staleness of the weight snapshot the anchor forwards from, in trainer
    # steps. 0 = current weights; 1 = the prior step's weights.
    delay_K: 1

    # When true, the anchor owns and broadcasts the PowerSGD basis Q; the fast
    # path's basis update is gated off.
    owns_q: false

    # Pair the anchor's stale weights with the batch generated by those same
    # weights. Uses the paired replay ring when enabled.
    replay_paired_batch: false

    # Where anchor weight snapshots live between ticks: "gpu" or "cpu".
    snapshot_device: gpu

  # Spectral-correction sub-config (inert while enabled=false). Applies an
  # anchor-guided correction to the fast-path gradient after actor backward /
  # FSDP grad reduction and before optimizer.step() / grad clipping. Live
  # mergers: none, delayed_ef, inject, blend, ef_powersgd, signed_ema.
  spectral:

    # Target dataclass for this configuration
    _target_: verl.workers.config.CommEffSpectralConfig

    # Whether anchor-guided gradient correction runs (gated by comm_eff.enabled)
    enabled: false
    # Correction cadence in optimizer steps. 1 = fire every step (strict no-op
    # default). Validated >= 1. Mirrors anchor.cadence; set == anchor.cadence so
    # corrections use a freshly-refreshed anchor EMA.
    cadence: 1

    # When false, skip the per-step spectral DIAGNOSTIC overhead (per-matrix
    # rel_change compute + GPU->CPU sync + diagnostic prints, and the anchor
    # relevance probe). true (default) = current behavior, byte-identical.
    # Neutral: nothing the optimizer sees changes; the canary assert and the
    # aggregate counters are preserved. Set false only for runtime efficiency.
    diagnostics: true

    # EMA decay for the anchor-gradient running matrix M_anchor.
    beta_anc: 0.95

    # Substrings selecting which named 2D params receive correction (skips
    # norms / biases / embeddings / lm head).
    target_substr: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

    # Cap on target matrices corrected per step. -1 means no cap and caps both
    # anchor extraction and merger writeback.
    max_targets: -1

    # Where the anchor EMA M_anchor lives between refreshes: "gpu" (HBM,
    # faithful) | "cpu" (offloaded to pinned CPU, memory-lean).
    ema_device: gpu

    # Correction mode (anchor combiner the fast-path grad uses).
    # "none" = maintain M but leave G_comp unchanged.
    # "signed_ema" = mix the fast gradient with anchor-EMA signs.
    # "inject" = add the scale-matched complement of M_anchor.
    # "blend" = convex blend toward scale-matched M_anchor.
    # "ef_powersgd" = direction-preserving error feedback.
    # "delayed_ef" = K-delayed codec residual:
    # G_corr = G_comp + delayed_ef_lambda*(M_rep - G_comp_ring(t-K)).
    correction_mode: none

    # Injection strength for correction_mode="inject" (force along the stale
    # true-gradient direction, scale-matched to ||G_mask||). Unused otherwise. >= 0.
    inject_gamma: 1.0

    # Convex-blend weight for correction_mode="blend":
    # G_corr=(1-blend_eta)*G_mask + blend_eta*scale*M_anchor. 0 => pure G_mask,
    # 1 => scale-matched stale true gradient. Unused otherwise. [0, 1].
    blend_eta: 0.5

    # signed_ema merger weight alpha. alpha=1 returns G_noisy unchanged.
    # Unused unless correction_mode=signed_ema. [0, 1].
    signed_ema_alpha: 0.0

    # Error-feedback residual knobs (correction_mode=ef_powersgd).
    # ef_decay: EMA decay on the accumulated off-subspace residual, [0, 1).
    # ef_clip:  residual norm cap as a FRACTION of ||G_comp|| (shape-aware), >= 0.
    # ef_decay=0 and ef_clip=0 yields G_corr == G_comp.
    ef_decay: 0.0
    ef_clip: 0.0

    # delayed_ef residual weight lambda in
    # G_corr = G_comp + lambda*(M_rep - G_comp_ring(t-K)).
    # 0.0 returns G_comp exactly. >= 0. Unused unless correction_mode=delayed_ef.
    delayed_ef_lambda: 0.0

    # Optional additive stale-anchor rank-r sub-basis folded into the delayed_ef
    # correction term. r=0 skips the branch; r_delta=0 leaves the correction
    # uncompressed. The forward codec Q is untouched.
    delta_subbasis_rank: 0
    delta_subbasis_family: tail
    r_delta: 0

    # Sub-basis weight schedule. The weight can hold for
    # delta_subbasis_hold_steps, then linearly decay over
    # delta_subbasis_decay_steps. All >= 0.
    delta_subbasis_weight: 1.0
    delta_subbasis_decay_steps: 0
    delta_subbasis_hold_steps: 0

    # Optional zero-mean, cross-rank-identical perturbation added after delayed_ef
    # correction. perturb_sigma=0 disables it. perturb_sigma >= 0.
    perturb_sigma: 0.0
    perturb_seed: 0

    # Normalized correction-delta momentum. mu=0 disables it. When age_decay is
    # true, held corrections fade with age. mu in [0, 1); age_decay is a strict bool.
    delta_momentum_mu: 0.0
    delta_momentum_age_decay: false

    # Optional adaptive delayed_ef dose. mode in {off, cos, ratio}; kappa >= 0;
    # lambda_cap >= 0. Keep "off" quoted because bare off is YAML-1.1 boolean false.
    adaptive_lambda_mode: "off"
    adaptive_lambda_kappa: 0.0
    lambda_cap: 2.0
  # (inert unless parent enabled=true AND compression_type=powersgd). The codec
  # replaces each boundary block's hidden state M with its rank-r projection onto
  # a shared frozen per-layer orthonormal basis Q: M_hat=(M@Q)@Qᵀ (Q detached, M
  # in-graph; NO straight-through). Registered regardless of compression_type so
  # a prf_mask run that forwards comm_eff.powersgd.* still parses (the
  # clean_cadence struct-mode gotcha).
  powersgd:

    # Target dataclass for this configuration
    _target_: verl.workers.config.CommEffPowerSGDConfig

    # Sub-switch; gated by the parent comm_eff.enabled AND compression_type=powersgd.
    enabled: true

    # Retained projection rank r. r=102 matches the PRF mask at p=0.95
    # (q*H = 0.05*2048 = 102.4). r==H (=2048) is the lossless limiting case
    # M_hat=M used by the correctness probe.
    rank: 102

    # Base seed for the deterministic per-layer basis bootstrap
    # (seed_L = (seed*1_000_003 + layer_idx*7919) & 0x7FFFFFFF). Identical on
    # every rank => zero-communication codebook init.
    seed: 0

    # Logical pipeline-shard count (same boundary selection as the mask):
    # last block of every shard except the final. L=16/pp_size=8 -> [1,3,..,13].
    pp_size: 8

    # Block-power-iteration basis-update cadence in optimizer steps. 1 = refresh
    # Q every (non-clean) step; >1 = refresh only on (global_step % cadence)==0.
    update_cadence: 1

    # true (default) carries Q across steps (warm block power iteration); false
    # re-bootstraps from the per-layer seed every update (cold, diagnostic).
    warm_start: true

    # true (default) also projects the old-logprob recompute so BOTH
    # gradient-feeding forwards see the same frozen Q_t (=> importance ratio ~1).
    compress_recompute: true

    # true (default — required for a correct shared codebook under DP). Each DP
    # rank builds its sketch V from its OWN data shard, so a per-rank orth(V)
    # would DIVERGE the per-boundary Q across ranks. true all-reduces the raw
    # sketches over the DP group before orth so every rank gets the SAME pooled
    # consensus Q. false is diagnostic only.
    sync_basis: true

    # Dtype for orthonormalization and stored-basis math. The projection itself
    # runs in the activation dtype.
    qr_dtype: fp32

    # Floor under the QR / singular-value floor for the q_cond diagnostic, so a
    # rank-deficient sketch never yields a non-finite condition number. > 0.
    reortho_eps: 1e-6

    # Live Q-basis family consumed by orth(V). "act" uses activation energy;
    # {grad, adv, tail, hybrid, ticket} build gradient/advantage-oriented bases.
    q_basis: act

    # Passive basis families accumulated inside the anchor pass, off the live Q /
    # fast path / optimizer. Empty means no passive accumulation.
    q_basis_passive: []

    # Hybrid family column split at fixed rank r. -1/-1 lets the implementation
    # choose; explicit non-negative values must sum to rank.
    hybrid_act_cols: -1
    hybrid_grad_cols: -1

  # Optional tensor capture. When enabled, comm-eff hooks dump detached tensors
  # keyed by (global_step, optimizer_tick, target_name, shape, dtype, norm).
  # Capture is dump-only and never feeds the optimizer.
  capture:

    # Target dataclass for this configuration
    _target_: verl.workers.config.CommEffCaptureConfig

    # Master capture switch. false means no capture hook fires.
    enabled: false

    # Directory the dumps and manifest are written to. Empty => ./captures.
    capture_dir: ""

    # Cap on optimizer ticks captured (the audit needs ~5-10). <=0 => no cap.
    max_ticks: 10

    # If >0, dump only this many targets per layer type. 0 => dump every target.
    stratified_targets: 0

    # Run the parallel UNCOMPRESSED fast backward to capture G_dense alongside
    # G_comp (detached/dump-only; the highest-OOM-risk probe). false => no second
    # backward.
    capture_g_dense: false

    # Capture the delay_K=0 fresh-anchor grad as a MEASUREMENT probe for the
    # sign-agreement decomposition (detached/dump-only). false => off.
    capture_fresh_anchor: false

    # Loss for the delay_K=0 fresh-anchor probe. Dump-only; never optimizer input.
    fresh_anchor_loss: clean_pg

    # Dump precision. "fp32" or "bf16".
    dump_dtype: fp32

    # Disk-volume guard: capture only rank 0 when true.
    rank0_only: true

    # Skip capture ticks below this value. 0 = capture from start.
    min_tick: 0

  # Geometry probe (telemetry-only). OFF by default. When enabled, appends one
  # JSON line per anchor fire plus a train-log line. Probes never feed the
  # optimizer. Requires paired replay and an inert merger.
  probe:

    # Target dataclass for this configuration
    _target_: verl.workers.config.CommEffProbeConfig

    # Master probe switch. false (default) => strict no-op.
    geometry_enabled: false

    # Directory for stepA_fires.jsonl (+ per-target sidecar). Empty => resolved
    # to ./geometry_probe at build. The launcher pins an absolute run-dir path.
    out_dir: ""

    # Stage/compute/write on DP rank 0 only (default; inputs are DP-identical).
    # false => rank-suffixed files (debug only).
    rank0_only: true

    # m4 lag depth j=1..m4_lags. [1, 5] (the <=6-entry CPU lag-buffer bound).
    m4_lags: 5

    # Also append the per-target scalar arrays behind each matrix-median to
    # stepA_fires_targets.jsonl (scalars only, ~KBs per fire).
    per_target_sidecar: true

    # EXP-42 weight-trajectory sketch instrument (dump-only). OFF by default.
    # Built independently of comm_eff.enabled, so the plain-GRPO (codec-OFF)
    # regime is instrumented. Records a per-tick count-sketch (+ per-matrix mean)
    # of the decoder weight matrices plus bounded EXACT fp32 headline scalars.
    # Telemetry-only: never feeds the optimizer / EMA / Q.
    weight_traj:

      # Target dataclass for this configuration
      _target_: verl.workers.config.CommEffWeightTrajConfig

      # Master switch. false (default) => strict no-op (no observer/summon/IO).
      enabled: false

      # Count-sketch width (buckets). 4096 => rel. std ~ 1/sqrt(k) ~ 1.6%.
      k: 4096

      # Directory for sketch_tick_*.npz + manifest.jsonl + calib.jsonl. Empty =>
      # ./weights at build. The launcher pins an absolute run-dir path.
      out_dir: ""

      # Sketch storage precision. "fp32" (default; REQUIRED for the weight-
      # difference reconstruction) or "fp16" (absolute magnitudes only).
      dump_dtype: fp32

      # EXP-42 completeness extension. false (default) => the 196 decoder matrices
      # the projector extrapolates. true => sketch EVERY 1-D/2-D param (decoder
      # linears + the projector-EXCLUDED token embeddings / RMSNorm gains / attn
      # biases), so the offline sweep can measure projection accuracy on the
      # excluded params too (a direct test of the prior-work exclusion claim).
      select_all: false

      # Spacings Δ (ticks) the on-box EXACT calibration evaluates. The full
      # horizon sweep is done offline from the sketch; this is the fp32 ground
      # truth the sketch is validated against. Operating point: Δ=10.
      calib_deltas: [10]

      # Horizons h (ticks) the on-box EXACT calibration evaluates. Operating
      # point: h=10. Add 5/20 for under/over-shoot if host RAM permits.
      calib_horizons: [10]

      # Ticks between opening exact-calib tripoint groups. 0 => AUTO = max(Δ+h)
      # so groups never overlap (≤3 full snapshots in flight per config).
      calib_stride: 0

      # Hard cap on retained full fp32 snapshots (the CPU-OOM guard; each is
      # ~5 GB on Qwen2.5-1.5B). New calib groups are dropped past the cap.
      calib_max_snapshots: 6

      # Sketch/compute/write on DP rank 0 only (the summoned full params are
      # DP-identical). Other ranks build an inactive observer (symmetric summon).
      rank0_only: true

# QAT (Quantization-Aware Training) configuration
# When enabled:
#   - QAT is automatically applied to actor model during training
#   - Fused scales (QKV/GateUp) are automatically enabled for training-inference consistency
#   - Fast quantization is used when syncing weights to vLLM rollout
# Supported modes: "w4a16" (NVFP4 weight-only)
# Note: "w4a4" mode is included in the code but currently has KL divergence issues and is NOT recommended for use.
# For usage examples, see: https://github.com/verl-project/verl-recipe/blob/main/qat/README.md
qat:

  # Whether to enable QAT
  enable: false

  # Quantization mode: "w4a16" (weight-only). "w4a4" is experimental and not recommended.
  mode: "w4a16"

  # Quantization group size (NVFP4 requires 16)
  group_size: 16

  # Patterns to ignore (e.g., lm_head, embed_tokens)
  ignore_patterns:

    - "lm_head"
    - "embed_tokens"
    - "re:.*mlp.gate$"

  # Activation observer for W4A4 mode: "static_minmax", "memoryless_minmax", or "minmax"
  activation_observer: "static_minmax"

  # Path to vLLM quantization config JSON file
  quantization_config_path: null
