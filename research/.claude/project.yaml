# Machine-readable project and harness configuration.

project:
  name: verl-compression-research
  description: Two-circuit communication-efficient GRPO research.
  north_star_doc: .claude/GOAL.md

github:
  research_repo: shamanez/verl-compression-research
  code_repo: shamanez/verl
  code_pr_base_branch: autonomous-harness-v1

local_state:
  durable_index: runs/SUMMARY.md

wandb:
  project: verl_compression_research
  entity: shamanework-pl

reports:
  repo_dir: /Users/shamane/Documents/com-eff-RLVR
  site_url: https://com-eff-rlvr.pages.dev
  runs_dir: runs
  artifacts_dir: artifacts
  push_on_publish: true
  r2:
    prefix: autonomous-harness-rlvr-compression
    console: https://dash.cloudflare.com/c0b687e3982c3fbcee1fc04607cd2683/r2/default/buckets/shamane-pluralis

budget:
  monthly_cap_usd: 1500

verification:
  gpu_idle_rule: Finish implementation and CPU checks before provisioning or attaching a GPU.
  gpu_occupancy_rule: >-
    Once a box is live, idle GPUs are the top-priority interrupt (operator
    directive 2026-07-15): fix-classify-relaunch cycles preempt all laptop-side
    work that could happen after the relaunch; target under 30 minutes of box
    idle per incident. Surfacing issues on the box and fixing them fast beats
    perfecting on the laptop while paid GPUs sit at 0 percent. Never relaunch a
    known-broken config just to occupy GPUs, and never trade correctness gates
    for occupancy.
  monitoring: Use the machine monitor for routine health checks and the training-log monitor only for anomalies.

source_tree:
  base_branch: autonomous-harness-v1

vast_ssh:
  identity_file: ~/.ssh/vast_ai_name

default_compute:
  gpu_mode: auto
  gpu_filter_chain:
    - "num_gpus=1 gpu_name=H200 gpu_ram>=140 cuda_max_good>=13.0 reliability>0.99 rentable=true verified=true"
    - "num_gpus=1 gpu_name=B200 gpu_ram>=180 cuda_max_good>=13.0 reliability>0.99 rentable=true verified=true"
    - "num_gpus=2 gpu_name=H200 gpu_ram>=140 cuda_max_good>=13.0 reliability>0.99 rentable=true verified=true"
  max_dph: 24.0
  max_gpu_hr: 96
  max_parallel: 1
  iterations: 3

current_default:
  model: qwen25-math-1p5b
  train_dataset: math
  validation_dataset: math
  method_launcher: bash examples/grpo_trainer/run_qwen25_math_1p5b_rank1_relex_fsdp.sh
  dense_control_launcher: bash examples/grpo_trainer/run_qwen25_math_1p5b_relex_comparison_fsdp.sh dense
  grpo:
    train_batch_size: 512
    ppo_mini_batch_size: 256
    ppo_micro_batch_size_per_gpu: 1
    ppo_epochs: 1
    actor_shuffle: false
    rollout_n: 8
    max_prompt_length: 1024
    max_response_length: 3072
    optimizer: AdamW
    learning_rate: 0.000001
    weight_decay: 0.01
    gradient_clip: 1
    loss_aggregation: token-mean
    reference_kl_type: low_var_kl
    reference_kl_coefficient: 0.001
    reward_kl_enabled: false
    entropy_coefficient: 0
    trainer_steps: 100
    validation_steps:
      - 0
      - 25
      - 50
      - 75
      - 100
  fast_circuit:
    pipeline_parallelism: required
    pipeline_stages: 8
    activation_projection: powersgd
    powersgd_rank: 77
    activation_derived_q: true
    synchronized_q: true
    warm_start_q: true
    fast_q_bootstrap: true
  slow_circuit:
    device: separate
    role: periodic_dense_gradient_anchor
    paired_replay: true
    batch_scope: ppo_minibatch
    cadence_optimizer_ticks: 20
    delay_optimizer_ticks: 20
    state_device: cpu
    owns_q: true
    weight_projection: rank1_relex
    weight_window: 4
    minimum_snapshots: 2
    projection_strength: 1.0
    gradient_correction: signed_ema
    signed_ema_alpha: 0.25
    anchor_ema_beta: 0.50

models:
  default: qwen25-math-1p5b
  entries:
    qwen25-math-1p5b:
      hf_id: Qwen/Qwen2.5-Math-1.5B
      chat_template: native
      use: train_and_validate
    qwen3-1p7b-base:
      hf_id: Qwen/Qwen3-1.7B-Base
      chat_template: native
      use: train_and_validate
    r1-distill-qwen-1p5b:
      hf_id: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
      chat_template: native
      use: train_and_validate
    open-nemotron-1p5b:
      hf_id: nvidia/OpenReasoning-Nemotron-1.5B
      chat_template: native
      use: train_and_validate
    qwen3-4b-base:
      hf_id: Qwen/Qwen3-4B-Base
      chat_template: native
      use: train_and_validate
    r1-distill-qwen-7b:
      hf_id: deepseek-ai/DeepSeek-R1-Distill-Qwen-7B
      chat_template: native
      use: integration_only
    r1-distill-llama-8b:
      hf_id: deepseek-ai/DeepSeek-R1-Distill-Llama-8B
      chat_template: native
      use: integration_only
    qwen3-8b-base:
      hf_id: Qwen/Qwen3-8B-Base
      chat_template: native
      use: integration_only

datasets:
  default: math
  data_source: DigitalLearningGmbH/MATH-lighteval
  reward: last boxed answer with is_equiv
  prep_script: research/scripts/prepare_rlvr_math.py
  entries:
    math:
      hf_id: EleutherAI/hendrycks_math
      train_split: native train
      validation_split: native test
      data_dir: $HOME/data/math
    numina-cot:
      hf_id: AI-MO/NuminaMath-CoT
      train_split: train
      validation_split: test
      data_dir: $HOME/data/numina_cot
    deepscaler:
      hf_id: qingy2024/DeepScaleR-40k
      train_split: train
      validation_split: held out from train
      data_dir: $HOME/data/deepscaler
    skywork-or1:
      hf_id: Skywork/Skywork-OR1-RL-Data
      train_split: math subset
      validation_split: held out from math subset
      data_dir: $HOME/data/skywork_or1
    dapo-math:
      hf_id: BytedTsinghua-SIA/DAPO-Math-17k
      train_split: train
      validation_split: held out from train
      data_dir: $HOME/data/dapo_math
perf_profiles: {}
