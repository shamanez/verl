# Project config — single source of truth for the values that agents need to operate.
# Update this file when porting the harness to a different research project; the
# operating-context blocks in agents/playbooks mirror these values inline as a
# token-cost optimization (so fresh-context agents don't need an extra read), but
# project.yaml is authoritative. If the two diverge, this file wins.
#
# Porting checklist (5 fields) — change these, the harness machinery comes along for free:
#   1. project.name + research_repo
#   2. source_tree.path + protect/exception paths (if you fork a different upstream)
#   3. vast_template.* (only if you maintain a different Vast.ai template)
#   4. default_compute.gpu_filter_chain (only if the new project needs a different shape)
#   5. .claude/GOAL.md (the project north-star — what "done" means)

project:
  name: verl-compression-research
  description: Communication-efficient pipeline-adaptation research on verl GRPO + GSM8K.
  north_star_doc: .claude/GOAL.md       # the project north-star — what "done" means (agent-readable, operator-approved); THE single source of project intent

workspace:
  working_dir: /Users/shamane/Documents/verl/research/
  secrets_file: $HOME/.config/verl-research/secrets.env
  secrets_required:
    - HF_TOKEN
    - WANDB_API_KEY
    - VAST_API_KEY                # personal Vast.ai account (default; account=private)
  secrets_optional:
    - VAST_API_KEY_TEAM           # shared "Pluralis Research" team Vast.ai account; used when VAST_ACCOUNT=team
  secrets_file_perms: "600"
  # Vast.ai account selector: VAST_ACCOUNT=team|private (default private). team -> VAST_API_KEY_TEAM,
  # private -> VAST_API_KEY. Resolved by .claude/skills/_vast_account.sh; provision stamps the chosen
  # account on the handle/ledger as `vast_account`, and both teardown paths (vast-teardown skill +
  # teardown-finished-runs Stop hook) read it back so a box is always destroyed with the account that
  # created it. Operator picks it via the loop instruction ("use the team account") — see researcher_steps.md.

github:
  research_repo: shamanez/verl-compression-research          # gh-default — issues only (research:claim, status:*, verdict comments). NO PRs go here.
  research_repo_visibility: private
  code_repo: shamanez/verl                                    # PRs from exp/<N>-<slug> branches land HERE with base=vast-ai-workload
  code_pr_base_branch: vast-ai-workload                       # NEVER `main` — main tracks upstream
  labels:
    research_claim: research:claim                            # triage picks these up
    status_prefix: "status:"                                  # planned, approved, running, pass, revise, stop, done
    milestone_prefix: "milestone:"                            # M0, M1, M2, ... (user-defined semantics)
    kind_prefix: "kind:"                                      # experiment, ablation, implementation, brainstorm, literature

source_tree:                                                  # the upstream code the experiments operate on
  path: /Users/shamane/Documents/verl/
  remote: shamanez/verl                                       # the fork — pushes/PRs for verl code go HERE (NOT verl-project/verl)
  upstream_branch: main                                       # tracks verl-project/verl — READ-ONLY, never edit, never PR to it
  base_branch: vast-ai-workload                               # primary working branch on the fork — experiment-runner forks exp/<N>-<slug> from here, log-writer PRs back here
  protect_paths:                                              # protect-upstream PreToolUse hook refuses writes here
    - /Users/shamane/Documents/verl/                          # everything UNDER verl/
  allowed_paths:                                              # except these subtrees
    - /Users/shamane/Documents/verl/research/                 # always writable
  exception_branches:                                         # plus any path is writable when on these branches
    - exp/*                                                   # experiment-runner worktrees for code_change=true plans
    - vast-ai-workload                                        # the base working branch — research/ + examples/grpo_trainer/vast_*.sh edits live here

vast_template:                                                # the locked Vast.ai docker template the runner provisions
  name: verl-research-vllm020
  hash: 3b0f8b726ac3036d6c007bfa13b6d75f
  id: 447527
  image: verlai/verl:vllm020.dev1
  bundled_torch: 2.11.0+cu130
  bundled_vllm: 0.20.2
  recommended_disk_gb: 200
  registry_file: .claude/skills/vast-provision/templates.json

vast_ssh:                                                     # SSH identity the laptop uses to reach Vast.ai instances
  identity_file: ~/.ssh/vast_ai_name                          # private key — matching .pub registered on Vast (id 890294, name "vast_ai_name"). Rotated 2026-05-30 from the legacy ~/.ssh/vast_ai (id 835115) after that key failed container SSH-key injection on H200 instance 38444745. Override at runtime with VAST_SSH_IDENTITY.
  pubkey_file: ~/.ssh/vast_ai_name.pub                        # the registered public key (passed to `vastai attach ssh` for newly-provisioned boxes if needed)
  # NOTE: both keys remain registered on the account, so `vastai create instance --ssh` injects both and a box accepts either; we OFFER vast_ai_name. Legacy ~/.ssh/vast_ai (id 835115) kept as fallback.
  # sync-metrics.sh, experiment-runner SSH/rsync calls, and any future on-box helpers MUST pass `-i $(eval echo "$identity_file")` so the right key is offered. Bare `ssh root@host` will silently fall back to id_rsa/id_ed25519 and fail with publickey.

default_compute:                                              # planner emits these defaults unless the issue overrides
  gpu_count: 1
  gpu_filter_chain:                                           # DEFAULT ladder (2026-07-03): 1×H200 → 1×B200 → 2×H200 — runner tries each rung in order; first rung with ≥1 offer ≤ max_dph wins. Machine reliability strictly >0.99 on EVERY rung.
    - "num_gpus=1 gpu_name=H200 gpu_ram>=140 cuda_max_good>=13.0 reliability>0.99 rentable=true verified=true"   # default — proven for both datasets (GSM8K fast surface; Big-Math @ resp 4096, EXP-58)
    - "num_gpus=1 gpu_name=B200 gpu_ram>=180 cuda_max_good>=13.0 reliability>0.99 rentable=true verified=true"   # more HBM, still single-GPU
    - "num_gpus=2 gpu_name=H200 gpu_ram>=140 cuda_max_good>=13.0 reliability>0.99 rentable=true verified=true"
  legacy_gpu_filter_chain:                                    # RETIRED default (pre-2026-07-03 4×H200/8×H100 shapes). Used ONLY on explicit operator request — never walked by default.
    - "num_gpus=4 gpu_name=H200 gpu_ram>=140 reliability>=0.95 rentable=true verified=true"
    - "num_gpus=8 gpu_name=H100 gpu_ram>=80 reliability>=0.95 rentable=true verified=true"
  max_dph: 24.0
  max_gpu_hr: 96
  max_parallel: 1
  wall_clock_hr: 12
  iterations: 3

datasets:                                                     # EASY/HARD dataset registry — SINGLE SOURCE OF TRUTH; other docs reference this block, never restate values
  default: easy
  easy:
    name: GSM8K
    prep: "launcher-managed — examples/data_preprocess/gsm8k.py runs automatically when DATA_DIR is absent"
    max_response_length: "per launcher surface (accel base = 1024; full legacy control = 16384)"
  hard:
    name: Big-Math
    hf_id: gshasiri/Big-Math-RL-Verified-filtered             # 123,602 train / 6,506 val
    prep: "python3 research/scripts/bigmath_dapo.py --local_save_dir /root/data/bigmath --train-cap 0 --val-size 500 --seed 42; then launch with DATA_DIR=/root/data/bigmath (skips the launcher's gsm8k prep)"
    data_source: DigitalLearningGmbH/MATH-lighteval           # reward-fn routing key set by bigmath_dapo.py — do NOT use math_bigmath (pred:None crashes val agg) or math_dapo (ignores \boxed{}); see plan 58
    max_response_length: 4096                                 # hard-dataset default — carried from EXP-58 (1000 clean steps on 1×H200)

default_baseline:                                             # the reference a new experiment compares against when its issue body omits `baseline_run:`
  run: baseline                                               # the dense control = comm-eff OFF (byte-identical to unmodified verl)
  launcher: examples/grpo_trainer/vast_comm_eff_accel_base_qwen25_1p5b_grpo_gsm8k.sh   # the canonical accelerated comm-eff base (signed_ema 0.25/0.50 + accel surface + diagnostics=false); dense ref = same accel surface with COMM_EFF_ENABLED=false
  dense_control: baseline                                     # the verl-unmodified dense reference; name it explicitly with `baseline_run: baseline`

fixed_control_surface:                                        # LOCKED training hyperparameters — operator directive 2026-06-04; comm-eff substrate locked 2026-06-09; accelerated base 2026-06-18. Extends CLAUDE.md §1 model/loss/hardware controls.
  doc: research/runs/FIXED_CONTROL_SURFACE.md                 # authoritative human-readable sheet (batch/lr/substrate/steps/contexts pinned)
  rule: "every GSM8K comm-eff experiment runs the accelerated comm-eff base (launcher vast_comm_eff_accel_base_*.sh): accel surface (use_dynamic_bsz=True, resp 2048, rollout TP=1, gpu_mem_util 0.55, ppo_max_token 24576, 50 steps, test_freq 25, val_before_train=False) + signed_ema(α=0.25, β_anc=0.50) core + diagnostics=false speed knob, on the locked PowerSGD r=77 anchor substrate (anchor owns Q, cadence/delay_K=5, clean=0, replay_paired_batch, disable_custom_all_reduce). The ONLY axis that may vary is the merger (how the stale anchor gradient is USED). Dense (enabled=false on the same accel surface) is the reference (≈0.7657; comm-eff signed_ema(0.25,0.50) ≈0.7362). Values live in the launcher, NOT duplicated here."
  variable_axis: merger                                       # how M/δ is folded into the fast update; accel base default = signed_ema(α=0.25, β_anc=0.50). Substrate (powersgd r77, anchor owns_q) + accel surface are LOCKED.
  measurement_knobs: [test_freq]                              # NOT control variables (validation is read-only) — canonical test_freq=25

launchers:                                                    # launch-script stability contract — full text in examples/grpo_trainer/VAST_README.md §"Stability contract"
  dir: examples/grpo_trainer/                                 # canonical, committed launchers live here (vast_*.sh, branch vast-ai-workload)
  naming: "vast_<scenario>_<model>_<algo>_<dataset>.sh"
  override_model: canonical-launcher + CLI/env overrides      # a run calls the canonical launcher and overrides only the knobs it varies (${VAR:-default} env vars + Hydra "$@" passthrough) — never re-types the baseline
  sandbox: research/runs/EXP-<ID>/                            # per-run config.yaml / launch.sh / patches are VOLATILE — never the source of truth
  promotion: auto-propose-on-PASS                             # log-writer opens a DRAFT PR (base vast-ai-workload) baking the proven values into a canonical launcher; human merges
  provenance:                                                 # "what settings actually ran" must never be lost to drift
    capture_script: research/scripts/capture_resolved_config.py
    artifact: resolved_params.txt                             # Hydra last-wins key=value, extracted from train.log set -x trace; ground truth, NOT the plan or a manifest
    rule: "promotion + manifests derive from resolved_params.txt, never from prose"

agent_models:
  # DOCUMENTATION ONLY — and the one block where the "project.yaml wins" rule at the
  # top of this file is INVERTED. The authoritative control for an agent's model and
  # reasoning effort is its own frontmatter (`model:` + `effort:` in
  # .claude/agents/<name>.md), which is what Claude Code actually reads at spawn time.
  # project.yaml cannot re-point an agent. This block records the policy + rationale so
  # the whole spread is reviewable in one place; if you change an agent's frontmatter,
  # update the matching row here by hand (and vice versa).
  #
  # Policy (operator directive 2026-06-29): STRICT best model — every agent runs on
  # Opus 4.8 (claude-opus-4-8). Model is NOT a tunable; the ONLY knob is reasoning
  # effort, with a FLOOR of `high` (no agent at low/medium, and none on Sonnet/Haiku).
  # Effort is tiered by role within {high, xhigh, max}:
  #   • max  — the two agents that AUTHOR load-bearing artifacts: research-planner
  #            (designs the plan) and experiment-runner (writes/patches verl code +
  #            launch payload). A wrong plan/patch burns GPU money, so they get the ceiling.
  #   • xhigh — analyst: deep verdict reasoning, one notch below max.
  #   • high  — training-log-monitor + log-writer (the floor). Held at the floor (NOT a
  #            cost-vs-quality model choice — both are now Opus 4.8) because the monitor is
  #            a high-frequency ~80-poll/run loop and log-writer is mechanical.
  # "ultracode" (xhigh + dynamic-workflow orchestration) is a MECHANISM, not a per-agent
  # effort: it is launched at the SESSION level (orchestrator/triage/interactive) for the
  # hard lanes — moment-of-truth analysis, hard code_change patches, hard planning, parallel
  # runs — because workflows spawn their own workers and a leaf subagent cannot host one.
  # See the `workflows:` block below. The /goal evaluator runs on Opus 4.8: Claude Code's
  # small-fast-model slot (env ANTHROPIC_DEFAULT_HAIKU_MODEL, default Haiku) is OVERRIDDEN to
  # claude-opus-4-8 in settings.json, so NO Haiku model ever runs (see `goal_command:`).
  #
  # Reasoning-effort rule: research-planner + experiment-runner @ max; analyst @ xhigh;
  # training-log-monitor + log-writer @ high (the floor). Model = Opus 4.8 for all.
  reasoning_effort_rule: "Opus 4.8 for ALL agents (strict best-model policy); effort floor=high; research-planner+experiment-runner @ max, analyst @ xhigh, training-log-monitor+log-writer @ high; ultracode/workflows = session-level mechanism for the hard lanes"
  context_window_rule: "every agent requests the 1M context window via the [1m] model suffix (e.g. claude-opus-4-8[1m]); keep the suffix on every agent. CLAUDE_CODE_SUBAGENT_MODEL is intentionally NOT set — it would flatten the per-agent reasoning-effort tiers below (all agents are Opus 4.8; only effort varies)."
  agents:
    analyst:
      model: "claude-opus-4-8[1m]"
      effort: xhigh
      why: writes PASS/REVISE/STOP verdicts that gate expensive compute — deep judgment, but not a plan/code author, so xhigh (max is reserved for research-planner + experiment-runner)
    research-planner:
      model: "claude-opus-4-8[1m]"
      effort: max
      why: designs falsifiable experiment plans — heaviest reasoning load in the harness; the plan author, one of the two max agents
    experiment-runner:
      model: "claude-opus-4-8[1m]"
      effort: max
      why: writes/patches verl code on exp/* branches + authors launch.sh/config/provisioning payload — the code author, one of the two max agents. Operator directive — max (not Anthropic's xhigh coding-default) because a wrong patch or mis-provision burns real GPU money and corrupts the run.
    training-log-monitor:
      model: "claude-opus-4-8[1m]"
      effort: high
      why: traceback classification is load-bearing (Ray dedup-wraps tracebacks, FSDP1 multi-frame grad chains). Opus 4.8 per the strict best-model policy; effort held at `high` (the floor) because it is a high-frequency ~80-poll/run loop where per-poll cost compounds. May be a worker inside a session-launched deep-diagnostics workflow.
    log-writer:
      model: "claude-opus-4-8[1m]"
      effort: high
      why: mechanical append/copy/rewrite + draft PR (genuinely not reasoning-heavy). Opus 4.8 per the strict best-model policy; effort held at `high` (the floor). Never launches a workflow — its durable git/GitHub mutations stay single-shot.

# ─────────────────────────────────────────────────────────────────────────────
# New-feature policy (operator directive 2026-06-29). Full design + rollout:
# .claude/HARNESS_FEATURE_INTEGRATION.md. These three blocks are the single
# source of truth for HOW /goal, dynamic workflows (ultracode), and agent teams
# are used in this harness; playbooks/runbook/CLAUDE.md mirror one-line pointers.
# ─────────────────────────────────────────────────────────────────────────────

goal_command:                                                 # Claude Code /goal — DRIVES the autonomous loop to completion
  status: enabled
  role: "the autonomous loop launch commands START with /goal so a session does not stop until the plan's success-criteria are met (or it escalates). See researcher_steps.md §2/§3."
  evaluator_model: claude-opus-4-8                            # the /goal done-judge runs on Opus 4.8. NO Haiku model runs anywhere in this harness.
  evaluator_model_env: ANTHROPIC_DEFAULT_HAIKU_MODEL          # HOW: this is Claude Code's small-fast-model slot (its DEFAULT is Haiku); settings.json OVERRIDES it to claude-opus-4-8 so NO Haiku ever runs. The var NAME says 'HAIKU' but its EFFECT is to ELIMINATE Haiku. Do NOT delete the override (that lets the slot fall back to Haiku). Operator note (non-directive): this also routes other small-fast/background calls to Opus — an accepted cost trade-off under the strict best-model policy; do NOT change without an operator directive.
  transcript_evidence_rule: "the /goal evaluator is transcript-only (no tools; cannot read runs.jsonl/WandB/verdict.md/labels). The orchestrator MUST print a plan-completion ledger each tick (every success-criterion + its evidence, DONE/PENDING) so the judge can see 'done'. Without surfaced evidence the goal never confirms (spins) or false-confirms on a mere claim."
  escape_hatch: "every /goal condition MUST include an escape — '… OR log STUCK/MANUAL_REVIEW_NEEDED' + a turn bound (e.g. 'stop after 200 turns') — so an impossible criterion cannot burn money forever."
  stop_hook_interaction: "/goal blocks the Stop event, so budget safety must NOT depend on the Stop hook firing: the orchestrator runs teardown-finished-runs.sh IN-FOREGROUND every tick — keep it; this is the mandatory, trusted budget backstop."
  must_not_replace: [human status:approved gate, teardown-finished-runs.sh foreground sweep, GOAL.md north-star]

workflows:                                                    # Claude Code dynamic workflows / `ultracode` — ENABLED in the harness
  status: enabled
  driver_policy: "the unattended /loop|/goal driver runs at effort=max (NOT session-wide `/effort ultracode`); it launches workflows EXPLICITLY per lane. Session-wide ultracode auto-escalates every tick and pushes orchestration state into ephemeral script variables — the driver's value is crash-durable file/ledger state."
  interactive_policy: "an operator interactive session MAY use `/effort ultracode` freely (big analysis, design, hard coding)."
  workflow_lanes:                                             # where the SESSION launches a workflow instead of dispatching a single subagent
    - "analysis (moment of truth): fan out N analysts (reward·length·entropy·grad-cosine·train-infer gap) -> adversarial verify -> one verdict"
    - "live in-training diagnostics: deep probe fan-out on the live box; the 30s SSH poll stays the always-on heartbeat"
    - "hard planning: judge-panel — draft N approaches -> score -> synthesize"
    - "parallel/sequential runs: pipeline/fan-out across multiple approved plans & boxes"
    - "hard code_change patches: implement -> adversarial review -> test (worktree); experiment-runner executes the result"
  read_only_auto_approve_rule: "workflow worker agents auto-approve edits (acceptEdits; no prompt when headless). SAFE only for the read-only lanes (analysis/planning/diagnostics — they touch only runs/ + reports). Anything that SPENDS MONEY or mutates durable state (vast-provision, git branches, PRs, runs.jsonl) STAYS a gated single-shot subagent — NEVER a worker inside an auto-approving workflow. This preserves the status:approved gate + budget caps."
  not_disabled: "CLAUDE_CODE_DISABLE_WORKFLOWS is intentionally NOT set; the `ultracode` keyword/effort tier stays available."
  saved_workflows_dir: .claude/workflows/                     # e.g. parallel-runs.md — read input via the `args` global

agent_teams:                                                  # Claude Code agent teams — CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS=1 is set in the environment
  status: enabled-opt-in
  unattended_substrate: "the two background sessions + single-shot subagents remain the crash-durable spine (issues + runs.jsonl + files). Do NOT replace them with an Agent team: in-process teammates do NOT survive /resume, background bash has no network egress, one-team-per-session, no nesting."
  sanctioned_uses:
    - "parallel runs: one teammate per concurrent box (typed from experiment-runner) — provisioning still via the gated single-shot runner path, never an auto-approving teammate"
    - "operator-run adversarial verdict review: spawn analyst-typed teammates that defend vs. challenge a verdict, reconcile into one verdict.md (GPU-free, post-teardown, NEVER flips status:approved)"
  caveat: "a teammate spawned from a subagent definition does NOT inherit that def's `skills`/`mcpServers` frontmatter — keep team uses GPU-free and skill-free (no vast-* dependency)."
