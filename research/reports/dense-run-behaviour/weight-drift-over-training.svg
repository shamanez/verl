<line x1="98" y1="86" x2="122" y2="86" stroke="#2e7d32" stroke-width="2"/>
<circle cx="110" cy="86" r="2.3" fill="#2e7d32"/>
<text x="128" y="90" font-size="12" fill="#2C2C2A">GSM8K (easy)</text>
<line x1="98" y1="104" x2="122" y2="104" stroke="#b23a2e" stroke-width="2"/>
