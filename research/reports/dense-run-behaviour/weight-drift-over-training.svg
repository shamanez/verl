<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" viewBox="0 0 680 350" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<title>Cumulative weight change from the start of training</title>
<desc>Median distance between the current weights and the weights at the start of training, as a percentage of the weight norm, over 15 tracked matrices, plotted against training step for GSM8K and Big-Math. Both curves rise gradually and stay under 0.06 percent through step 75.</desc>
<rect x="0" y="0" width="680" height="350" fill="#ffffff"/>
<text x="363" y="26" text-anchor="middle" font-size="15" font-weight="500" fill="#2C2C2A">Cumulative weight change from the start of training</text>
<text x="363" y="44" text-anchor="middle" font-size="11" fill="#5F5E5A">median over 15 tracked matrices, as a percentage of the weight norm</text>
<line x1="78" y1="62" x2="648" y2="62" stroke="#ececec" stroke-width="1"/>
<line x1="78" y1="141.3" x2="648" y2="141.3" stroke="#ececec" stroke-width="1"/>
<line x1="78" y1="220.7" x2="648" y2="220.7" stroke="#ececec" stroke-width="1"/>
<line x1="78" y1="62" x2="78" y2="300" stroke="#9a9a9a" stroke-width="1.2"/>
<line x1="78" y1="300" x2="648" y2="300" stroke="#9a9a9a" stroke-width="1.2"/>
<text x="72" y="66" text-anchor="end" font-size="11" fill="#5F5E5A">0.06</text>
<text x="72" y="145.3" text-anchor="end" font-size="11" fill="#5F5E5A">0.04</text>
<text x="72" y="224.7" text-anchor="end" font-size="11" fill="#5F5E5A">0.02</text>
<text x="72" y="304" text-anchor="end" font-size="11" fill="#5F5E5A">0</text>
<text x="78" y="316" text-anchor="middle" font-size="11" fill="#5F5E5A">0</text>
<text x="192" y="316" text-anchor="middle" font-size="11" fill="#5F5E5A">15</text>
<text x="306" y="316" text-anchor="middle" font-size="11" fill="#5F5E5A">30</text>
<text x="420" y="316" text-anchor="middle" font-size="11" fill="#5F5E5A">45</text>
<text x="534" y="316" text-anchor="middle" font-size="11" fill="#5F5E5A">60</text>
<text x="648" y="316" text-anchor="middle" font-size="11" fill="#5F5E5A">75</text>
<text x="363" y="338" text-anchor="middle" font-size="12" fill="#2C2C2A">training step</text>
<text x="22" y="181" text-anchor="middle" font-size="12" fill="#2C2C2A" transform="rotate(-90,22,181)">weight change from start (%)</text>
<polyline fill="none" stroke="#2e7d32" stroke-width="2" points="85.6,295.6 93.2,275.4 100.8,259.9 116,234.6 154,192.5 192,168.7 230,154 268,142.9 306,134.2 344,125.9 382,117.9 420,110.4 458,104 496,97.7 534,91.7 572,85.8 610,79.9 648,74.3"/>
<polyline fill="none" stroke="#b23a2e" stroke-width="2" points="85.6,296 93.2,280.6 100.8,269.5 116,256 154,226.6 192,207.6 230,193.3 268,182.6 306,174.3 344,165.5 382,157.2 420,148.9 458,141.7 496,133.4 534,125.9 572,118.3 610,111.2 648,104"/>
