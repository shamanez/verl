<?xml version="1.0" encoding="UTF-8"?>
<svg width="700" viewBox="0 0 680 326" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<title>Two-circuit GRPO training</title>
<desc>A fast compressed network updates every step on current weights. A slow anchor network holds stale weights, rolls out trajectories from those exact stale weights, and forms an EMA of its gradients; the sign of that EMA is fed back periodically as a correction to the fast network.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#5F5E5A" stroke-width="1.6"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#993C1D" stroke-width="1.6"/></marker>
</defs>
<rect x="0" y="0" width="680" height="326" fill="#ffffff"/>
<text x="340" y="22" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">fast compressed circuit, repeats every step</text>
<path d="M571 70 C 545 38, 180 38, 109 70" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="40" y="70" width="138" height="56" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.3"/>
<text x="109" y="92" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">live weights</text>
<text x="109" y="110" text-anchor="middle" font-size="12" fill="#0F6E56">current &#952;t</text>
<rect x="194" y="70" width="138" height="56" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.3"/>
<text x="263" y="92" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">GRPO gradient</text>
<text x="263" y="110" text-anchor="middle" font-size="12" fill="#0F6E56">current rollouts</text>
<rect x="348" y="70" width="138" height="56" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.3"/>
<text x="417" y="92" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">compress</text>
<text x="417" y="110" text-anchor="middle" font-size="12" fill="#0F6E56">boundary, rank r</text>
<rect x="502" y="70" width="138" height="56" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.3"/>
<text x="571" y="92" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">sign correction</text>
<text x="571" y="110" text-anchor="middle" font-size="12" fill="#0F6E56">optimizer step</text>
<line x1="178" y1="98" x2="192" y2="98" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="332" y1="98" x2="346" y2="98" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="486" y1="98" x2="500" y2="98" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="109" y1="126" x2="120" y2="248" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="128" y="192" font-size="12" fill="#5F5E5A">lagged copy, stale by delay</text>
<line x1="553" y1="250" x2="571" y2="128" stroke="#993C1D" stroke-width="1.7" marker-end="url(#ahc)"/>
<text x="545" y="192" text-anchor="end" font-size="12" font-weight="500" fill="#993C1D">sign(M), every delay</text>
<text x="338" y="236" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">slow anchor circuit (stale weights and rollouts)</text>
<rect x="40" y="250" width="160" height="56" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1.3"/>
<text x="120" y="272" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">stale weights</text>
<text x="120" y="290" text-anchor="middle" font-size="12" fill="#993C1D">&#952;t-K (lagged)</text>
<rect x="240" y="250" width="190" height="56" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1.3"/>
<text x="335" y="272" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">rollouts</text>
<text x="335" y="290" text-anchor="middle" font-size="12" fill="#993C1D">from those stale weights</text>
<rect x="470" y="250" width="166" height="56" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1.3"/>
<text x="553" y="272" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">anchor gradient</text>
<text x="553" y="290" text-anchor="middle" font-size="12" fill="#993C1D">EMA M, sign(M)</text>
<line x1="200" y1="278" x2="238" y2="278" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="430" y1="278" x2="468" y2="278" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/>
</svg>
