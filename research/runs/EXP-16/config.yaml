# EXP-16 — Short-run stability matrix. Materialised run config.
# Cross-product of the plan's sweep_grid as a hand-ordered diagnostic ladder
# (NOT a free sweep). fanout capped at compute.max_parallel = 1 (STRICTLY
# sequential, one warm box). Cell 0 is a GPU pre-flight GATE (on_fail:stop),
# NOT a training cell. Cells 1..6 are sequential tmux sessions on the SAME box.
#
# Each cell's env-override block is passed verbatim in front of
#   bash examples/grpo_trainer/vast_comm_eff_baseline_qwen25_1p5b_grpo_gsm8k.sh
# on the exp/16-short-run-stability-matrix branch (launcher reads ${VAR:-default}).
# CRITICAL: every cell sets TOTAL_TRAINING_STEPS explicitly (launcher default is
# 100 — a forgotten override blows the budget) AND TEST_FREQ = its final step
# (so each cell validates once at its last step; launcher default 25 would skip
# validation for the 10- and 20-step cells).

experiment: EXP-16
branch: exp/16-short-run-stability-matrix
launcher: examples/grpo_trainer/vast_comm_eff_baseline_qwen25_1p5b_grpo_gsm8k.sh
max_parallel: 1                  # sequential by mandate — ONE box, warm reuse, NO re-provision
fixed_controls:
  MODEL_PATH: Qwen/Qwen2.5-1.5B-Instruct
  dataset: gsm8k
  MAX_RESPONSE_LENGTH: 16384
  objective: vanilla GRPO no-KL no-entropy
  MASK_P: 0.9
  MASK_RECOMPUTE: true
  granularity: channel           # structural; not a knob
  consistent: true               # structural; not a knob

cells:
  - index: 0
    name: gpu-preflight-cross-forward-mask-consistency
    kind: gate
    on_fail: stop
    depends_on: null
    commands:
      - "pytest -v tests/workers/comm_eff/test_activation_mask.py"
      - "pytest -v tests/workers/comm_eff/test_mask_rescale.py"
    settings_A: { COMM_EFF_MASK_ENABLED: true, COMM_EFF_MASK_P: 0.9, COMM_EFF_MASK_RECOMPUTE: true, COMM_EFF_MASK_RESCALE: false }
    settings_B: { COMM_EFF_MASK_ENABLED: true, COMM_EFF_MASK_P: 0.9, COMM_EFF_MASK_RECOMPUTE: true, COMM_EFF_MASK_RESCALE: true }

  - index: 1
    name: grpo_mask_channel_p0p9_no_rescale_10steps
    kind: train
    depends_on: 0
    role: unstable-high-mask-CONTROL
    total_training_steps: 10
    test_freq: 10
    env:
      COMM_EFF_ENABLED: true
      COMM_EFF_MASK_ENABLED: true
      COMM_EFF_MASK_P: 0.9
      COMM_EFF_MASK_RESCALE: false
      COMM_EFF_MASK_RECOMPUTE: true
      COMM_EFF_CLEAN_CADENCE: 0
      COMM_EFF_ANCHOR_ENABLED: false
      COMM_EFF_SPECTRAL_ENABLED: false
      TOTAL_TRAINING_STEPS: 10
      TEST_FREQ: 10

  - index: 2
    name: grpo_mask_channel_p0p9_rescale_10steps
    kind: train
    depends_on: 1
    role: isolate-rescale
    total_training_steps: 10
    test_freq: 10
    env:
      COMM_EFF_ENABLED: true
      COMM_EFF_MASK_ENABLED: true
      COMM_EFF_MASK_P: 0.9
      COMM_EFF_MASK_RESCALE: true
      COMM_EFF_MASK_RECOMPUTE: true
      COMM_EFF_CLEAN_CADENCE: 0
      COMM_EFF_ANCHOR_ENABLED: false
      COMM_EFF_SPECTRAL_ENABLED: false
      TOTAL_TRAINING_STEPS: 10
      TEST_FREQ: 10

  - index: 3
    name: grpo_mask_channel_p0p9_no_rescale_clean_every4_20steps
    kind: train
    depends_on: 2
    role: no-rescale + clean-every-4
    total_training_steps: 20
    test_freq: 20
    env:
      COMM_EFF_ENABLED: true
      COMM_EFF_MASK_ENABLED: true
      COMM_EFF_MASK_P: 0.9
      COMM_EFF_MASK_RESCALE: false
      COMM_EFF_MASK_RECOMPUTE: true
      COMM_EFF_CLEAN_CADENCE: 4
      COMM_EFF_ANCHOR_ENABLED: false
      COMM_EFF_SPECTRAL_ENABLED: false
      TOTAL_TRAINING_STEPS: 20
      TEST_FREQ: 20

  - index: 4
    name: grpo_mask_channel_p0p9_rescale_clean_every4_20steps
    kind: train
    depends_on: 3
    role: rescale + clean-every-4
    total_training_steps: 20
    test_freq: 20
    env:
      COMM_EFF_ENABLED: true
      COMM_EFF_MASK_ENABLED: true
      COMM_EFF_MASK_P: 0.9
      COMM_EFF_MASK_RESCALE: true
      COMM_EFF_MASK_RECOMPUTE: true
      COMM_EFF_CLEAN_CADENCE: 4
      COMM_EFF_ANCHOR_ENABLED: false
      COMM_EFF_SPECTRAL_ENABLED: false
      TOTAL_TRAINING_STEPS: 20
      TEST_FREQ: 20

  # Cell 5 REQUIRES the T5 code change (committed on this branch, 928bd22a).
  # Pre-launch VERIFY: grep -n 'use_orig_params=true' <launcher> -> line ~302.
  - index: 5
    name: grpo_mask_channel_p0p9_rescale_anchor2_spectral2_20steps
    kind: train
    depends_on: 4
    role: spectral-switch-on (FSDP/spectral safety cell)
    total_training_steps: 20
    test_freq: 20
    requires_code_change: T5
    env:
      COMM_EFF_ENABLED: true
      COMM_EFF_MASK_ENABLED: true
      COMM_EFF_MASK_P: 0.9
      COMM_EFF_MASK_RESCALE: true
      COMM_EFF_MASK_RECOMPUTE: true
      COMM_EFF_CLEAN_CADENCE: 0
      COMM_EFF_ANCHOR_ENABLED: true
      COMM_EFF_ANCHOR_CADENCE: 2
      COMM_EFF_ANCHOR_DELAY_K: 2
      COMM_EFF_SPECTRAL_ENABLED: true
      COMM_EFF_SPECTRAL_CADENCE: 2
      COMM_EFF_SPECTRAL_ALPHA: 0.5
      COMM_EFF_SPECTRAL_TAU: 0.01
      COMM_EFF_SPECTRAL_BETA_ANC: 0.9
      COMM_EFF_SPECTRAL_EMA_DEVICE: gpu
      COMM_EFF_SPECTRAL_SVD_MODE: full
      COMM_EFF_SPECTRAL_BASIS_CACHE: cache
      TOTAL_TRAINING_STEPS: 20
      TEST_FREQ: 20

  - index: 6
    name: dense_grpo_comm_eff_off_25step_reference
    kind: train
    depends_on: 5
    role: MANDATORY final dense reference + T5 strict-no-op proof
    total_training_steps: 25
    test_freq: 25
    env:
      COMM_EFF_ENABLED: false
      TOTAL_TRAINING_STEPS: 25
      TEST_FREQ: 25
