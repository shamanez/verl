# EXP-8 materialized run config — M2 anchor circuit 3-cell, 5-step smoke.
# This documents the sweep cells for the analyst; launch.sh carries the exact
# Hydra overrides inline (per-cell), reading the cell from EXPERIMENT_NAME.
# fanout capped at compute.max_parallel=1 (3 cells run SEQUENTIALLY on one box).
experiment: EXP-8
title: "M2 — anchor circuit: same-process K-stale unmasked GRPO-actor-loss refresh + five-step smoke"
issue: 8
code_change: true
branch: exp/8-anchor-circuit
entrypoint: examples/grpo_trainer/vast_baseline_qwen25_1p5b_grpo_gsm8k.sh   # via launch.sh

shared:
  model: Qwen/Qwen2.5-1.5B-Instruct
  total_training_steps: 5            # operator 5-step mandate (anchor fires ~4x at cadence=1)
  val_before_train: false
  ppo_epochs: 1
  train_batch_size: 8
  ppo_mini_batch_size: 4
  rollout_n: 2
  max_prompt_length: 256
  max_response_length: 256
  entropy_coeff: 0.001               # EXP-7 precedent: nonzero grad independent of reward variance
  fsdp_use_orig_params: true         # EXP-7 FSDP regime: full logical 2D p.grad
  logger: [console, wandb]           # default; 5 steps appear in WandB

cells:
  - name: m2-anchor-faithful         # CELL 1 — headline integrated M95+AP, faithful storage
    comm_eff.enabled: true
    comm_eff.mask.enabled: true
    comm_eff.mask.p: 0.95
    comm_eff.spectral.enabled: true
    comm_eff.spectral.alpha: 0.3
    comm_eff.spectral.tau: 0.001
    comm_eff.spectral.beta_anc: 0.95
    comm_eff.spectral.seed_anchor_cache: false   # live anchor POPULATES M_anchor
    comm_eff.spectral.ema_device: gpu
    comm_eff.spectral.svd_mode: full
    comm_eff.spectral.basis_cache: cache
    comm_eff.spectral.max_targets: 4
    comm_eff.anchor.enabled: true
    comm_eff.anchor.cadence: 1
    comm_eff.anchor.delay_K: 1
  - name: m2-anchor-off              # CELL 2 — anchor-OFF regression (reproduces EXP-7 seeded spectral)
    comm_eff.enabled: true
    comm_eff.mask.enabled: true
    comm_eff.mask.p: 0.95
    comm_eff.spectral.enabled: true
    comm_eff.spectral.alpha: 0.3
    comm_eff.spectral.tau: 0.001
    comm_eff.spectral.beta_anc: 0.95
    comm_eff.spectral.seed_anchor_cache: true    # EXP-7 ran on the seeded cache
    comm_eff.spectral.ema_device: gpu
    comm_eff.spectral.svd_mode: full
    comm_eff.spectral.basis_cache: cache
    comm_eff.spectral.max_targets: 4
    comm_eff.anchor.enabled: false               # the EXP-7 regression: zero anchor activity
    comm_eff.anchor.cadence: 1
    comm_eff.anchor.delay_K: 1
  - name: m2-anchor-lean             # CELL 3 — memory-lean storage under realistic target load
    comm_eff.enabled: true
    comm_eff.mask.enabled: true
    comm_eff.mask.p: 0.95
    comm_eff.spectral.enabled: true
    comm_eff.spectral.alpha: 0.3
    comm_eff.spectral.tau: 0.001
    comm_eff.spectral.beta_anc: 0.95
    comm_eff.spectral.seed_anchor_cache: false
    comm_eff.spectral.ema_device: cpu            # EMA offloaded to (pinned) CPU
    comm_eff.spectral.svd_mode: lowrank          # torch.svd_lowrank(q=rank)
    comm_eff.spectral.rank: 8
    comm_eff.spectral.basis_cache: cache
    comm_eff.spectral.max_targets: -1            # ALL 2D decoder matrices (stresses offload)
    comm_eff.anchor.enabled: true
    comm_eff.anchor.cadence: 1
    comm_eff.anchor.delay_K: 1

compute:
  gpu_filter_chain:
    - "num_gpus=4 gpu_name=H100 gpu_ram>=80 cuda_max_good>=13.0 reliability>=0.95 rentable=true verified=true"
    - "num_gpus=4 gpu_name=H200 gpu_ram>=140 cuda_max_good>=13.0 reliability>=0.95 rentable=true verified=true"
    - "num_gpus=8 gpu_name=H100 gpu_ram>=80 cuda_max_good>=13.0 reliability>=0.95 rentable=true verified=true"
    - "num_gpus=8 gpu_name=H200 gpu_ram>=140 cuda_max_good>=13.0 reliability>=0.95 rentable=true verified=true"
  max_dph: 24.0
  max_gpu_hr: 10
  max_parallel: 1
  wall_clock_hr: 3
