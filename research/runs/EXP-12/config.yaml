# EXP-12 — REVISE child of EXP-8, anchor backward graph isolation.
# Sweep grid is encoded as 3 SEQUENTIAL cells in launch.sh (non-negotiable #2).
# This file is the runner manifest; the Hydra overrides per cell live in launch.sh.
experiment:
  id: EXP-12
  title: "REVISE child of EXP-8 — anchor backward graph isolation (clone-no-hook)"
  parent: EXP-8
  lineage_iteration: 1   # of 3 (REVISE budget)
  branch: exp/12-anchor-detach
  branch_remote: origin/exp/12-anchor-detach
  code_change: true

compute:
  gpu_count: 1                  # nodes, not per-node GPUs
  max_dph: 24.0
  max_gpu_hr: 10
  max_parallel: 1
  wall_clock_hr: 3
  iterations: 3

cells:
  - name: m2-anchor-faithful
    note: "anchor enabled, faithful storage (gpu/full/cache), max_targets=4"
  - name: m2-anchor-off
    note: "anchor DISABLED — reproduces EXP-7 spectral PASS"
  - name: m2-anchor-lean
    note: "anchor enabled, lean storage (cpu/lowrank/cache), max_targets=-1"

execution:
  pattern: STRICTLY_SEQUENTIAL    # non-negotiable #2 — no parallel cells
  launcher: launch.sh
  steps_per_cell: 5
  total_train_steps: 15
  per_cell_log: train_<cell>.log
  per_cell_done_flag: done_<cell>.flag
  aggregate_done_flag: done.flag

verify_skip:
  reason: "non-negotiable #3 — operator override (EXP-6 / EXP-8 precedent); pre-written verify file present"
  verify_file: verify/20260528T130000.md
