# EXP-37C run config — single cell, config-only on the LOCKED accel comm-eff base.
# Operator-directed sibling of EXP-37B (issue #37). TWO deltas vs EXP-37B:
#   beta_anc 0.50 -> 0.0 (anchor-gradient EMA history dropped: M = latest fire only)
#   latency  5/5  -> 20/20 (cadence=20, delay_K=20 — the latency that collapsed EXP-37)
experiment: EXP-37C
issue: 37
kind: experiment
milestone: M6
code_change: false
wandb_project: verl_compression_research_accel_rebaseline   # overlays EXP-37/37B/37D/36B/36C
baseline_run: EXP-37   # same 20/20 latency; EXP-37 was beta_anc=0.50 (collapsed) — this run = beta_anc=0.0
cells:
  - id: 1
    name: signed_ema-cad20-delay20-beta0-100step
    experiment_name: exp-37c-cad20-delay20-beta0-100step
    launcher: examples/grpo_trainer/vast_comm_eff_accel_base_qwen25_1p5b_grpo_gsm8k.sh
    env:
      PROJECT_NAME: verl_compression_research_accel_rebaseline
      EXPERIMENT_NAME: exp-37c-cad20-delay20-beta0-100step
      TOTAL_TRAINING_STEPS: 100
      TEST_FREQ: 25
    anchor: cadence=20 delay_K=20   # OVERRIDDEN from accel-base default 5/5 via trailing hydra
    beta_anc: 0.0                   # M = latest anchor gradient only; no EMA history
    trailing_hydra_args:            # all three ride as trailing args (banner LIES — echoes bare exports)
      - actor_rollout_ref.actor.comm_eff.spectral.beta_anc=0.0
      - actor_rollout_ref.actor.comm_eff.anchor.cadence=20
      - actor_rollout_ref.actor.comm_eff.anchor.delay_K=20
