# EXP-4 — M2 comm_eff no-op scaffolding parity smoke (run config)
# Materialised by experiment-runner from .claude/plans/4.md.
#
# This is a paired no-op parity smoke, NOT a knob sweep: fanout_max=1, one
# instance, three back-to-back runs. The launch.sh shipped alongside this file
# drives all three runs sequentially on the single provisioned box.
#
# All three runs use the SAME fixed smoke shape (distinct from EXP-3's real run)
# and the SAME seed + pinned vLLM rollout RNG so the disabled-path actor scalars
# are comparable to the unmodified-launcher reference (criterion 7, rel-tol 1e-4).

experiment:
  id: EXP-4
  branch: exp/4-commeff-noop          # forked from origin/vast-ai-workload
  model: Qwen/Qwen2.5-1.5B-Instruct   # fixed by CLAUDE.md; do not swap
  dataset: gsm8k
  algorithm: grpo                     # vanilla dense GRPO (control variable)

# Fixed smoke knobs (from plan ## Experiment design smoke_shape).
smoke_shape:
  TRAIN_BATCH_SIZE: 8
  PPO_MINI_BATCH_SIZE: 4
  ROLLOUT_N: 2
  MAX_PROMPT_LENGTH: 256
  MAX_RESPONSE_LENGTH: 256
  PPO_MAX_TOKEN_LEN_PER_GPU: 4096
  LOG_PROB_MAX_TOKEN_LEN_PER_GPU: 4096
  REF_LOG_PROB_MAX_TOKEN_LEN_PER_GPU: 4096
  ppo_epochs: 1
  total_training_steps: 2             # 2 trainer steps x 2 substeps/step = 4 actor optimizer substeps
  val_before_train: false
  SAVE_FREQ: -1
  TEST_FREQ: -1
  TOTAL_EPOCHS: 1
  seed: 1                             # single fixed seed; deterministic no-op claim

# The three back-to-back runs (launch.sh executes in this order on ONE box).
runs:
  - name: m2-commeff-noop-disabled    # Run A: explicit comm_eff.enabled=false on exp/4 branch
    comm_eff_override: "actor_rollout_ref.actor.comm_eff.enabled=false"
    code_on_path: exp/4-commeff-noop
    metrics_subdir: m2-commeff-noop-disabled

  - name: m2-commeff-noop-default     # Run B: NO comm_eff override (config default false) on exp/4 branch
    comm_eff_override: ""             # rely on registered default
    code_on_path: exp/4-commeff-noop
    metrics_subdir: m2-commeff-noop-default

  - name: m2-commeff-noop-reference   # Reference: unmodified vast-ai-workload, NO comm_eff code on path
    comm_eff_override: ""
    code_on_path: vast-ai-workload    # checkout the base branch (no scaffolding) for this run
    metrics_subdir: m2-commeff-noop-reference

# Compute (from plan ## Compute budget). gpu_filter_chain is walked cheapest-first
# by the runner; the chosen tier is recorded on the PROVISIONED ledger row.
compute:
  gpu_count: 1                        # one Vast.ai instance (multi-GPU within it)
  max_dph: 24.0
  max_gpu_hr: 8
  max_parallel: 1
  wall_clock_hr: 3
