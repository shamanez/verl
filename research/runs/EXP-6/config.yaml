# EXP-6 run config — M2 mask contamination guard.
# Two cells (fanout_max=2): the masking-enabled smoke + a mask-off reference.
# The two-step GRPO smoke exercises validation (val_before_train + TEST_FREQ=1)
# and checkpoint (SAVE_FREQ=1) so the contamination invariants are observed in a
# live loop. Batch/context are tiny to stay under 8 GPU-hr / 3 h.
experiment: EXP-6
issue: 6
branch: exp/6-mask-invariants
baseline_run: baseline

# Shared smoke knobs (issue body). NGPUS is auto-detected on the box (4..8).
common_env:
  PROJECT_NAME: verl_compression_research
  EXPERIMENT_NAME: m2-mask-invariants
  TRAIN_BATCH_SIZE: 8
  PPO_MINI_BATCH_SIZE: 4
  ROLLOUT_N: 2
  MAX_PROMPT_LENGTH: 256
  MAX_RESPONSE_LENGTH: 256
  PPO_MAX_TOKEN_LEN_PER_GPU: 4096
  LOG_PROB_MAX_TOKEN_LEN_PER_GPU: 4096
  REF_LOG_PROB_MAX_TOKEN_LEN_PER_GPU: 4096
  SAVE_FREQ: 1
  TEST_FREQ: 1
  TOTAL_EPOCHS: 1

common_overrides:
  - trainer.total_training_steps=2
  - trainer.val_before_train=True
  - actor_rollout_ref.actor.ppo_epochs=1

cells:
  # cell 0 — masking ENABLED (the contamination-guard subject)
  # NOTE: comm_eff is a field on the ACTOR config; the Hydra path is
  # actor_rollout_ref.actor.comm_eff.* (bare comm_eff.* fails Hydra merge).
  - name: mask_on
    overrides:
      - actor_rollout_ref.actor.comm_eff.enabled=true
      - actor_rollout_ref.actor.comm_eff.mask.enabled=true
      - actor_rollout_ref.actor.comm_eff.mask.p=0.95
      - actor_rollout_ref.actor.comm_eff.mask.pp_size=8
  # cell 1 — mask-off reference (dense-path regression + log-prob/val equality ref)
  - name: mask_off
    overrides:
      - actor_rollout_ref.actor.comm_eff.enabled=false

compute:
  gpu_count: 1
  max_dph: 24.0
  max_gpu_hr: 8
  max_parallel: 1
  wall_clock_hr: 3
