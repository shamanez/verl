# EXP-58 run config — single collection cell (no sweep). The knobs below are the
# resolved recipe from .claude/plans/58.md; the actual settings that RUN are the
# env exports in launch.sh -> ckpt_r2_collection_cell.sh -> comm-eff launcher (the
# set -x resolved main_ppo command in driver.log is the ground truth).
experiment: EXP-58
kind: experiment
code_change: true
branch: exp/58-ckpt-r2
vast_account: team

deliverables:
  A_weight_traj: fp32 weight snapshots every 20 steps -> R2 verl-research/EXP-58/regimeA/weights (50 expected)
  B_checkpoints: full global_step_<N>/ tree every 20 steps -> R2 verl-research/EXP-58/regimeA/checkpoints (50 expected)

dataset:
  name: Big-Math-RL-Verified-filtered
  data_source_reward_key: DigitalLearningGmbH/MATH-lighteval   # NOT math_bigmath / math_dapo
  local_dir: /root/data/bigmath
  prep: "python3 research/scripts/bigmath_dapo.py --local_save_dir /root/data/bigmath --train-cap 0 --val-size 500 --seed 42"

method:
  comm_eff_enabled: false          # dense path = EXP-57 regimeA (anchor OFF resolved default)
  strategy: fsdp                   # FSDP1 ONLY — never fsdp2
  use_orig_params: true
  disable_custom_all_reduce: true

model: Qwen2.5-1.5B-Instruct
loss: vanilla GRPO (no-KL, no-entropy)

schedule:
  probe:      { total_training_steps: 2,    save_freq: 1,  total_epochs: 2, max_response_length: 4096 }
  collection: { total_training_steps: 1000, save_freq: 20, total_epochs: 2, max_response_length: 4096 }

checkpoint_r2:
  CKPT_R2_ENABLED: true
  CKPT_R2_ASYNC: true
  CKPT_R2_DELETE_LOCAL: true
  CKPT_R2_MAX_STAGED_GB: 50
  CKPT_R2_WORKERS: 4
  max_actor_ckpt_to_keep: null

weight_traj_r2:
  WEIGHT_TRAJ_FULL_DTYPE: fp32
  WEIGHT_TRAJ_PER_TICK: false
  WEIGHT_TRAJ_FULL_EVERY: 20
  WEIGHT_TRAJ_R2_ENABLED: true
  WEIGHT_TRAJ_R2_ASYNC: true
  WEIGHT_TRAJ_R2_FLUSH_EVERY: 20
  WEIGHT_TRAJ_R2_WORKERS: 4
  WEIGHT_TRAJ_R2_MAX_STAGED_GB: 80

r2:
  R2_BUCKET: shamane-pluralis
  R2_EXPERIMENT: EXP-58
  R2_REGIME: regimeA

compute_ladder:
  rung1: { gpus: 1, gpu: H200, max_price: 6.0,  allow_single_gpu: 1, rollout_tp: 1 }
  rung2: { gpus: 1, gpu: B200, max_price: 10.0, allow_single_gpu: 1, rollout_tp: 1 }
  rung3: { gpus: 2, gpu: H200, max_price: 12.0, allow_single_gpu: 1, rollout_tp: 2 }
  rung4: { gpus: 4, gpu: H200, max_price: 24.0, allow_single_gpu: 0, rollout_tp: 4 }
  disk_gb: 200
  max_gpu_hr: 96
