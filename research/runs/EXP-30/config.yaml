# EXP-30 run config — materialized from $PARENT/.claude/plans/30.md (issue #30).
# THIS DISPATCH LAUNCHES ONLY cell index 0 (stepA_geometry_probe).
# B1/B2 are GATED on the Step-A pre-registered gates (plan §Pre-registered gates,
# VERBATIM thresholds) and belong to a LATER dispatch after laptop-side gate
# evaluation writes runs/EXP-30/stepA_gate.md. They are recorded here so the
# controlled-variables assert (resolved-params diff confined to {correction_mode,
# weight, probe flag, capture posture, total_training_steps}) is auditable.
experiment: EXP-30
issue: https://github.com/shamanez/verl-compression-research/issues/30
branch: exp/30-valid-m-geometry        # pushed to origin BEFORE launch (7e7e77dfb)
code_change: true
box: operator-provided instance 40697545 (4xH200, dph 13.9678) — do NOT provision, do NOT teardown
max_parallel: 1
fanout: 1                              # gated cell structure, NOT a sweep

common:                                # every cell (the locked substrate + EXP-29 donor knobs)
  launcher: examples/grpo_trainer/vast_comm_eff_baseline_qwen25_1p5b_grpo_gsm8k.sh
  env:
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True   # standing OOM guard
    COMM_EFF_SPECTRAL_EMA_DEVICE: cpu                   # standing OOM guard (launcher default, pinned)
    PPO_MAX_TOKEN_LEN_PER_GPU: "18432"                  # standing OOM guard (launcher default, pinned)
    COMM_EFF_SPECTRAL_BETA_ANC: "0.0"                   # beta_anc=0 everywhere (non-negotiable)
    COMM_EFF_SPECTRAL_EF_DECAY: "0.0"                   # retired ef knobs pinned dead (merger hygiene)
    COMM_EFF_SPECTRAL_EF_CLIP: "0.0"
    COMM_EFF_SPECTRAL_BLEND_ETA: "0.3"                  # B1's weight, pinned in EVERY cell so the B-cell diff is correction_mode-only
    TEST_FREQ: "25"
    SEED: "0 (launcher/data defaults — fixed control surface)"
  hydra:
    actor_rollout_ref.actor.comm_eff.anchor.replay_paired_batch: "true"   # the issue's premise, EVERY cell
    actor_rollout_ref.actor.comm_eff.anchor.snapshot_device: "cpu"        # standing OOM guard
    actor_rollout_ref.actor.comm_eff.spectral.delayed_ef_lambda: "1.0"    # B2's weight, pinned in EVERY cell (inert unless mode=delayed_ef)

cells:
  - index: 0
    name: stepA_geometry_probe          # ALWAYS runs; produces the gate inputs
    launch_this_dispatch: true
    env:
      EXPERIMENT_NAME: exp30_stepA_geometry_probe
      COMM_EFF_SPECTRAL_CORRECTION_MODE: none           # correction INERT (anchor_grad_corrected==0 all run)
      TOTAL_TRAINING_STEPS: "20"                        # 40 ticks = 8 fires (7 post-warmup); extend <=25 only if fires < 7
      VAL_BEFORE_TRAIN: "True"                          # val ONLY at step 0 (test_freq=25 > 20 steps) — NOT a deliverable
    hydra:
      actor_rollout_ref.actor.comm_eff.probe.geometry_enabled: "true"     # tier-2 bounded captures (the gate consumes them)
      actor_rollout_ref.actor.comm_eff.probe.out_dir: /workspace/runs/EXP-30/metrics
      actor_rollout_ref.actor.comm_eff.probe.rank0_only: "true"
      actor_rollout_ref.actor.comm_eff.probe.m4_lags: "5"
      actor_rollout_ref.actor.comm_eff.probe.per_target_sidecar: "true"
    deliverable: /workspace/runs/EXP-30/metrics/stepA_fires.jsonl (>=7 post-warmup fires, complete m1-m7)
  - index: 1
    name: B1_blend_valid_M
    launch_this_dispatch: false         # GATED — iff GATE-B1 OPEN per stepA_gate.md (later dispatch)
    env:
      EXPERIMENT_NAME: exp30_B1_blend_valid_M
      COMM_EFF_SPECTRAL_CORRECTION_MODE: blend          # eta=0.3 via the pinned COMM_EFF_SPECTRAL_BLEND_ETA
      TOTAL_TRAINING_STEPS: "50"
      VAL_BEFORE_TRAIN: "True"
    hydra:
      actor_rollout_ref.actor.comm_eff.probe.geometry_enabled: "false"    # production: probe OFF, capture OFF, tier-1 scalars
  - index: 2
    name: B2_delayed_ef_valid_residual
    launch_this_dispatch: false         # GATED — iff GATE-B2 OPEN; serialized after B1 (max_parallel 1)
    env:
      EXPERIMENT_NAME: exp30_B2_delayed_ef
      COMM_EFF_SPECTRAL_CORRECTION_MODE: delayed_ef     # lambda=1.0 via the pinned delayed_ef_lambda
      TOTAL_TRAINING_STEPS: "50"
      VAL_BEFORE_TRAIN: "True"
    hydra:
      actor_rollout_ref.actor.comm_eff.probe.geometry_enabled: "false"
