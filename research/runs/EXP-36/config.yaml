experiment: EXP-36
kind: re-baseline (efficient comm_eff C2 peak point + dense control on accelerated 4xH200 surface)
box: reused operator 4xH200 (instance 41420622, team account), do-not-provision/do-not-teardown
code: exp/spectral-diagnostics-knob @ 3300cc61a6e60bc25a04c7cc089e45c9a0b15241 (adds comm_eff.spectral.diagnostics knob + actor.yaml struct-mirror)
acceleration_stack: USE_DYNAMIC_BSZ=True, PPO_MAX_TOKEN_LEN_PER_GPU=24576, LOG_PROB/REF token_len=32768, MAX_RESPONSE_LENGTH=2048, ROLLOUT_TP=1, ROLLOUT_GPU_MEM_UTIL=0.55
efficient_overrides_both_cells:
  - actor_rollout_ref.rollout.enable_chunked_prefill=true   # untested-with-this-codec knob; watched at launch
  - actor_rollout_ref.rollout.checkpoint_engine.update_weights_bucket_megabytes=4096
  - actor_rollout_ref.actor.fsdp_config.forward_prefetch=true
  - actor_rollout_ref.ref.fsdp_config.forward_prefetch=true
  - trainer.save_freq=0
  - trainer.val_before_train=False
fixed: {TOTAL_TRAINING_STEPS: 50, TEST_FREQ: 25, TRAIN_BATCH_SIZE: 128, PPO_MINI_BATCH_SIZE: 64, project: verl_compression_research_accel_rebaseline}
run_order_and_cells:
  - name: exp-36-c2eff-a025
    order: 1
    role: "efficient comm_eff peak point (signed_ema alpha=0.25, beta_anc=0.50, diagnostics=false)"
    launcher: examples/grpo_trainer/vast_comm_eff_b2_sota_qwen25_1p5b_grpo_gsm8k.sh
    overrides:
      - actor_rollout_ref.actor.comm_eff.spectral.correction_mode=signed_ema
      - actor_rollout_ref.actor.comm_eff.spectral.signed_ema_alpha=0.25
      - actor_rollout_ref.actor.comm_eff.spectral.beta_anc=0.50
      - actor_rollout_ref.actor.comm_eff.spectral.diagnostics=false
    notes: "ema_device=cpu + anchor.snapshot_device=cpu kept at launcher defaults (operator rejected gpu as OOM-risky)"
  - name: exp-36-dense
    order: 2
    role: "dense control = comm_eff OFF"
    launcher: examples/grpo_trainer/vast_comm_eff_baseline_qwen25_1p5b_grpo_gsm8k.sh
    env: {COMM_EFF_ENABLED: false}
    overrides:
      - actor_rollout_ref.actor.comm_eff.enabled=false   # belt-and-suspenders, last-wins
    notes: "no diagnostics override (comm_eff off => irrelevant)"
