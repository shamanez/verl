# EXP-26 run config — materialized by experiment-runner from .claude/plans/26.md
# STAGED, gated experiment. max_parallel=1. Step A is the diagnostic GATE; Steps
# B/C/E do NOT launch until the analyst returns Step A's DECISION. The launch
# script reads the cell index from its tmux session name (exp-26-<host>-<cell>).
#
# Substrate is LOCKED to the EXP-25 ground truth (runs/EXP-25/resolved_params.txt):
#   compression_type=powersgd, powersgd.rank=77, sync_basis=true,
#   anchor.enabled=true, anchor.owns_q=true, anchor.cadence=5, anchor.delay_K=5,
#   clean_cadence=0, spectral.beta_anc=0.95, spectral.max_targets=-1,
#   spectral.ema_device=cpu. Only the variable-under-test changes per stage.
#
# All cells call the SAME canonical launcher and override ONLY the cell's knobs
# (the stability contract): examples/grpo_trainer/vast_comm_eff_baseline_qwen25_1p5b_grpo_gsm8k.sh

experiment: EXP-26
issue: 26
branch: exp/26-geometry-audit-ef-powersgd
launcher: examples/grpo_trainer/vast_comm_eff_baseline_qwen25_1p5b_grpo_gsm8k.sh

# STAGE A — real-gradient geometry audit (THE GATE). 3 audit arms on identical
# prompts; capture flags ON; ~8 optimizer ticks, NO full training. Sequential on
# ONE box (max_parallel=1). Gates B/C.
stage_A:
  common_env:
    COMM_EFF_CAPTURE_ENABLED: "true"
    COMM_EFF_CAPTURE_DIR: "/workspace/captures"
    COMM_EFF_CAPTURE_MAX_TICKS: "8"
    COMM_EFF_CAPTURE_STRATIFIED: "4"     # 4 targets/matrix-type (volume guard)
    COMM_EFF_CAPTURE_G_DENSE: "true"
    COMM_EFF_CAPTURE_FRESH_ANCHOR: "true"
    COMM_EFF_CAPTURE_DUMP_DTYPE: "fp32"
    TOTAL_TRAINING_STEPS: "6"            # ~6 steps * 2 ticks/step >= 8 captured
    TEST_FREQ: "1000"                    # no eval during the audit (measurement-only)
    VAL_BEFORE_TRAIN: "False"
    SAVE_FREQ: "1000"
  cells:
    - id: A0_dense
      desc: "dense control (comm-eff OFF) — the true-update reference for cosines"
      env: { COMM_EFF_ENABLED: "false", EXPERIMENT_NAME: "exp26_A0_dense" }
    - id: A1_powersgd_r77
      desc: "plain PowerSGD r77 (anchor on + owns Q, NO merger) — H1 discriminator"
      env: { COMM_EFF_SPECTRAL_ENABLED: "false", EXPERIMENT_NAME: "exp26_A1_powersgd_r77" }
    - id: A2_signed_ema_a0p5
      desc: "EXP-25 anchor+signed_ema alpha=0.5 — the falsified merger; confirms H1"
      env:
        COMM_EFF_SPECTRAL_CORRECTION_MODE: "signed_ema"
        COMM_EFF_SPECTRAL_SIGNED_EMA_ALPHA: "0.5"
        EXPERIMENT_NAME: "exp26_A2_signed_ema_a0p5"

# STAGE B — ef_powersgd direction-preserving merger. GATED on Step A's DECISION.
# 3 arms + 1 ablation. 50 steps, val@25. Re-materialized + launched on the warm
# box AFTER the A-decision. ef_decay/ef_clip are analyst REVISE knobs.
stage_B:
  gated_on: "stage_A DECISION (go_B_skip_C or go_C_then_B); never before"
  common_env:
    COMM_EFF_CAPTURE_ENABLED: "true"       # per-arm cos(G_dense,G_corr)
    COMM_EFF_CAPTURE_DIR: "/workspace/captures"
    COMM_EFF_CAPTURE_MAX_TICKS: "8"
    COMM_EFF_CAPTURE_STRATIFIED: "4"
    COMM_EFF_CAPTURE_G_DENSE: "true"
    COMM_EFF_CAPTURE_FRESH_ANCHOR: "false"
    TOTAL_TRAINING_STEPS: "50"
    TEST_FREQ: "25"
    VAL_BEFORE_TRAIN: "True"
  cells:
    - id: B0_dense
      desc: "dense control — reproduce W&B val@50 0.7536 +/- 0.01"
      env: { COMM_EFF_ENABLED: "false", EXPERIMENT_NAME: "exp26_B0_dense" }
    - id: B1_powersgd_plain
      desc: "plain PowerSGD r77 (NO merger) — compression-benign reference"
      env: { COMM_EFF_SPECTRAL_ENABLED: "false", EXPERIMENT_NAME: "exp26_B1_powersgd_plain" }
    - id: B2_ef_powersgd
      desc: "ef_powersgd direction-preserving merger — headline Step-B arm"
      env:
        COMM_EFF_SPECTRAL_CORRECTION_MODE: "ef_powersgd"
        COMM_EFF_SPECTRAL_EF_CLIP: "1.0"     # residual cap = ||G_comp|| (analyst-revisable)
        COMM_EFF_SPECTRAL_EF_DECAY: "0.0"
        EXPERIMENT_NAME: "exp26_B2_ef_powersgd"
  ablation:
    - id: B3_ef_residual_off
      desc: "ef_powersgd residual OFF (ef_decay=ef_clip=0) MUST == plain PowerSGD"
      env:
        COMM_EFF_SPECTRAL_CORRECTION_MODE: "ef_powersgd"
        COMM_EFF_SPECTRAL_EF_CLIP: "0.0"
        COMM_EFF_SPECTRAL_EF_DECAY: "0.0"
        EXPERIMENT_NAME: "exp26_B3_ef_residual_off"

# STAGE C — RLVR-native Q sweep at FIXED rank 77. CONDITIONAL on Step A H2.
# q_basis families require the analyst-named sketch construction (compressor
# fails LOUD on non-"act" until implemented).
stage_C:
  gated_on: "stage_A DECISION == go_C_then_B (Q_act misses update energy / H2 true)"
  note: "q_basis families NOT YET implemented — analyst names sketch construction post Step A; runner adds it on exp/* then re-materializes C."
  q_basis_families: [act, grad, adv, tail, hybrid, ticket]

# STAGE E — dense-matched communication run. GATED on a stable parity method.
stage_E:
  gated_on: "a stable parity-recovering method exists (from B or C)"

compute:
  gpu_filter_chain:
    - "num_gpus=4 gpu_name=H200 gpu_ram>=140 reliability>=0.95 rentable=true verified=true"
    - "num_gpus=8 gpu_name=H100 gpu_ram>=80 reliability>=0.95 rentable=true verified=true"
  max_dph: 24.0
  max_gpu_hr: 60
  max_parallel: 1
