# EXP-5 run config — three smoke cells, one instance, back-to-back.
# Materialised from plan .claude/plans/5.md sweep_grid (comm_eff.mask.p) plus the
# disabled regression cell. fanout capped at compute.max_parallel=1 (one box).
experiment: EXP-5
instance: "38098877"        # 4xH200, dph=14.74, chosen_tier_idx=1
smoke_shape:
  TRAIN_BATCH_SIZE: 8
  PPO_MINI_BATCH_SIZE: 4
  ROLLOUT_N: 2
  MAX_PROMPT_LENGTH: 256
  MAX_RESPONSE_LENGTH: 256
  PPO_MAX_TOKEN_LEN_PER_GPU: 4096
  LOG_PROB_MAX_TOKEN_LEN_PER_GPU: 4096
  REF_LOG_PROB_MAX_TOKEN_LEN_PER_GPU: 4096
  ppo_epochs: 1
  total_training_steps: 2
  val_before_train: false
  SAVE_FREQ: -1
  TEST_FREQ: -1
  TOTAL_EPOCHS: 1
  mask_seed: 1234
cells:
  - name: m2-actor-mask-p95
    comm_eff.enabled: true
    comm_eff.mask.enabled: true
    comm_eff.mask.p: 0.95
    comm_eff.mask.pp_size: 8
  - name: m2-actor-mask-p90
    comm_eff.enabled: true
    comm_eff.mask.enabled: true
    comm_eff.mask.p: 0.90
    comm_eff.mask.pp_size: 8
  - name: m2-actor-mask-disabled
    comm_eff.enabled: false
