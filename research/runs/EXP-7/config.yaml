# EXP-7 run config — materialised from .claude/plans/7.md sweep_grid.
# fanout_max=1, one Vast cell. sweep_grid is a single operating point
# (comm_eff.spectral.alpha=0.3); alpha=1.0 and alpha=0 are unit-test invariants,
# not Vast cells. The launcher (vast_exp7_spectral_smoke.sh) reads CELL from its
# env, not a block index — there is only one fan-out cell (spectral_on); the
# disabled regression cell is a second, fast invocation on the same box.
experiment: EXP-7
title: "M2 spectral correction filter + FSDP gradient-application-point discovery"
branch: exp/7-spectral-fsdp-discovery
code_change: true

cells:
  - name: spectral_on            # PRIMARY deliverable
    CELL: spectral_on
    comm_eff:
      enabled: true
      mask: { enabled: false, p: 0.0 }     # masking OFF (combined mask+spectral is EXP-9)
      spectral:
        enabled: true
        alpha: 0.3
        tau: 0.001
        beta_anc: 0.95
        seed_anchor_cache: true
  - name: disabled               # regression: must equal EXP-5 / dense
    CELL: disabled
    comm_eff:
      enabled: false
      spectral: { enabled: false }

smoke:
  model_path: Qwen/Qwen2.5-1.5B-Instruct
  total_training_steps: 2
  val_before_train: false
  ppo_epochs: 1
  train_batch_size: 8
  ppo_mini_batch_size: 4
  rollout_n: 2
  max_prompt_length: 256
  max_response_length: 256

compute:
  gpu_count: 1
  max_dph: 24.0
  max_gpu_hr: 8
  max_parallel: 1
