# EXP-23 run config — materialized by experiment-runner.
# Codec is FIXED (PowerSGD r=77, copied verbatim from EXP-20 resolved_params);
# the ONLY axis is the refresh mechanism. This dispatch launches ONLY step 0
# (the two <=2-step smoke probes). The orchestrator launches A1/A2/A3 on smoke PASS.
id: EXP-23
branch: exp/23-stale-reanchor
launcher: examples/grpo_trainer/vast_comm_eff_baseline_qwen25_1p5b_grpo_gsm8k.sh

# Ground-truth PowerSGD codec block (verbatim from
# runs/EXP-20/resolved_params__ce_powersgd_r77_clean5_50s_gsm8k.txt). All arms hold this constant.
codec:
  compression_type: powersgd
  powersgd.rank: 77
  powersgd.sync_basis: true
  powersgd.update_cadence: 1
  powersgd.warm_start: true
  powersgd.compress_recompute: true
  powersgd.qr_dtype: fp32
  powersgd.seed: 0
  powersgd.pp_size: 8
  powersgd.reortho_eps: 1e-6

# Fixed training surface (FIXED_CONTROL_SURFACE.md) — held constant across all arms.
surface:
  model: Qwen/Qwen2.5-1.5B-Instruct
  data: gsm8k
  train_batch_size: 128
  ppo_mini_batch_size: 64
  ppo_micro_batch_size_per_gpu: 1
  rollout.n: 8
  max_response_length: 16384
  actor.optim.lr: 1e-6
  total_epochs: 2
  use_kl_loss: false
  use_kl_in_reward: false
  entropy_coeff: 0
  seed: 0

# ---- STEP 0 SMOKE (this dispatch) ----
smoke:
  total_training_steps: 2
  test_freq: 0
  val_before_train: false
  probes:
    PROBE_ON:    # integration proof — anchor+spectral inject on PowerSGD
      experiment_name: exp-23-smoke-on
      comm_eff.enabled: true
      comm_eff.compression_type: powersgd
      comm_eff.clean_cadence: 0
      comm_eff.anchor.enabled: true
      comm_eff.anchor.cadence: 5
      comm_eff.anchor.delay_K: 5             # delay_K trap: launcher default is 20 — pin to 5
      comm_eff.spectral.enabled: true
      comm_eff.spectral.correction_mode: inject
      comm_eff.spectral.inject_gamma: 1.0
      comm_eff.spectral.cadence: 5
      comm_eff.spectral.ema_device: cpu      # OOM guard
      ppo_max_token_len_per_gpu: 18432       # OOM guard (anchor 2nd backward)
    PROBE_OFF:   # off-path parity proof — PowerSGD r=77 byte-identical when circuit OFF
      experiment_name: exp-23-smoke-off
      comm_eff.enabled: true
      comm_eff.compression_type: powersgd
      comm_eff.clean_cadence: 0
      comm_eff.anchor.enabled: false
      comm_eff.spectral.enabled: false
      ppo_max_token_len_per_gpu: 36864       # A1's setting

# ---- 50-STEP ARMS (orchestrator launches these on smoke PASS — NOT this dispatch) ----
arms:
  A1_no_refresh:    {refresh_mechanism: none,         clean_cadence: 0, anchor.enabled: false, spectral.enabled: false, ppo_max_token_len_per_gpu: 36864, total_training_steps: 50, test_freq: 10}
  A2_stale_inject:  {refresh_mechanism: stale_inject, clean_cadence: 0, anchor.enabled: true, anchor.cadence: 5, anchor.delay_K: 5, spectral.enabled: true, spectral.correction_mode: inject, spectral.inject_gamma: 1.0, spectral.cadence: 5, spectral.ema_device: cpu, ppo_max_token_len_per_gpu: 18432, total_training_steps: 50, test_freq: 10}
  A3_stale_blend:   {refresh_mechanism: stale_blend,  clean_cadence: 0, anchor.enabled: true, anchor.cadence: 5, anchor.delay_K: 5, spectral.enabled: true, spectral.correction_mode: blend, spectral.blend_eta: 0.5, spectral.cadence: 5, spectral.ema_device: cpu, ppo_max_token_len_per_gpu: 18432, total_training_steps: 50, test_freq: 10}
